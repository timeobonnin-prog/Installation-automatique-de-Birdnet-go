name: 🤖 Auto-Fix YAML (Blindé)

on:
  # S'exécute toutes les 6 heures pour rattraper les erreurs
  schedule:
    - cron: "0 */6 * * *"
  # Permet de le lancer manuellement
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          # On utilise GH_PAT car GitHub interdit de modifier .github avec le token par défaut
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Prettier
        run: npm install -g prettier

      - name: Vérifier et corriger la syntaxe YAML
        run: |
          echo "Recherche des fichiers YAML à corriger..."

          # Prettier va reformater les fichiers. 
          # S'il y a une erreur de syntaxe simple (espace, guillemet), il la corrige.
          # Le "|| true" évite que le workflow plante si le fichier est irrécupérable.
          prettier --write ".github/workflows/*.yml" || true

          echo "Vérification terminée."

      - name: Vérifier s'il y a des modifications
        id: git-check
        run: |
          git diff --quiet .github/workflows/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Sauvegarder les corrections (Commit)
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/
          git commit -m "🤖 Auto-fix : Correction de la syntaxe YAML"
          git push

      - name: Résumé
        if: steps.git-check.outputs.changed == 'true'
        run: echo "✅ Des erreurs de syntaxe ont été trouvées et corrigées automatiquement !"

      - name: Aucun changement
        if: steps.git-check.outputs.changed != 'true'
        run: echo "✨ Tous les fichiers YAML sont déjà parfaitement formatés."
