name: Cleanup Old Branches

on:
  # Permet de le lancer manuellement depuis l'onglet Actions
  workflow_dispatch:
  # S'exécute automatiquement tous les dimanches à minuit
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete unnecessary branches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 1. Récupérer toutes les branches
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // 2. Récupérer toutes les Pull Requests ouvertes pour ne pas supprimer leurs branches
            const openPRs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            const openPRBranches = openPRs.map(pr => pr.head.ref);

            let deletedCount = 0;
            const protectedBranches = ['main', 'master', 'gh-pages'];

            // 3. Parcourir chaque branche
            for (const branch of branches) {
              const branchName = branch.name;

              // Si la branche est protégée ou liée à une PR ouverte, on passe
              if (protectedBranches.includes(branchName) || openPRBranches.includes(branchName)) {
                console.log(`⏭️ Ignorée (Protégée ou PR ouverte) : ${branchName}`);
                continue;
              }

              // Sinon, on la supprime
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branchName}`
                });
                console.log(`🗑️ Supprimée : ${branchName}`);
                deletedCount++;
              } catch (error) {
                console.log(`❌ Impossible de supprimer ${branchName} : ${error.message}`);
              }
            }

            console.log(`\n✅ Nettoyage terminé. ${deletedCount} branche(s) supprimée(s).`);
