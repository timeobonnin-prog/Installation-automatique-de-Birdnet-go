name: Auto-Format Code and Fix Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On utilise GH_PAT pour avoir les droits sur .github/workflows
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Prettier and Shell-format
        run: |
          npm install --no-save prettier
          sudo apt-get install -y shfmt

      - name: Run Prettier (Markdown, YAML, JSON)
        run: |
          npx prettier --write "**/*.{md,yml,yaml,json}" --ignore-path .gitignore || true

      - name: Run Shell-format (Bash)
        run: |
          find . -name "*.sh" -exec shfmt -w -i 2 -ci {} \; || true

      - name: Auto-commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-format: Correction des espaces et du code [skip ci]"
          commit_options: "--no-verify"
          file_pattern: "."
          push_options: "--force"
        env:
          # OBLIGATOIRE : Utilise la clé pour valider le commit
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
