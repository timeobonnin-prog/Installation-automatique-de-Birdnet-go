name: Auto-Format Code and Fix Spaces

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Prettier and Shell-format
        run: |
          npm install --no-save prettier
          sudo apt-get install -y shfmt

      - name: Run Prettier (Markdown, YAML, JSON)
        run: |
          npx prettier --write "**/*.{md,yml,yaml,json}" --ignore-path .gitignore || true

      - name: Run Shell-format (Bash)
        run: |
          # Formate tous les fichiers .sh pour un code propre
          find . -name "*.sh" -exec shfmt -w -i 2 -ci {} \; || true

      - name: Auto-commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-format: Correction des espaces et du code"
          commit_options: '--no-verify'
          file_pattern: '**/*.md **/*.yml **/*.yaml **/*.sh'
