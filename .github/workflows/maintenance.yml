name: Maintenance

on:
  schedule:
    - cron: "55 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  format:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          npm install --no-save prettier
          sudo apt-get install -y shfmt
      - run: |
          npx prettier --write "**/*.{md,yml,yaml,json}" --ignore-path .gitignore || true
          find . -name "*.sh" -exec shfmt -w -i 2 -ci {} \; || true
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-format [skip ci]"
          file_pattern: "*.md *.yml *.yaml *.sh *.bat *.iss"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

  cleanup-releases:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, { owner: context.repo.owner, repo: context.repo.repo });
            const byVersion = {};
            for (const r of releases) {
              // On cible UNIQUEMENT les builds Stables (ex: v20261031.001) pour les nettoyer.
              // On ignore complètement les "nightly-v..." et les "manual-v...".
              const m = r.tag_name.match(/^v(\d+)\.(\d+)$/);
              if (m) {
                const v = m[1];
                if (!byVersion[v]) byVersion[v] = [];
                byVersion[v].push({ r, build: parseInt(m[2], 10) });
              }
            }
            for (const v in byVersion) {
              const group = byVersion[v].sort((a, b) => b.build - a.build);
              // On garde l'index 0 (le plus récent), on supprime à partir de l'index 1
              for (let i = 1; i < group.length; i++) {
                try {
                  await github.rest.repos.deleteRelease({ owner: context.repo.owner, repo: context.repo.repo, release_id: group[i].r.id });
                  await github.rest.git.deleteRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${group[i].r.tag_name}` });
                  console.log(`Supprimé : ${group[i].r.tag_name}`);
                } catch (e) { console.log(`Erreur : ${e.message}`); }
              }
            }

  cleanup-branches:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branches = await github.paginate(github.rest.repos.listBranches, { owner: context.repo.owner, repo: context.repo.repo });
            const prs = await github.paginate(github.rest.pulls.list, { owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            const prot = ['main', 'master', 'gh-pages'];
            const prB = prs.map(p => p.head.ref);
            for (const b of branches) {
              if (prot.includes(b.name) || prB.includes(b.name)) continue;
              try { await github.rest.git.deleteRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `heads/${b.name}` }); } catch (e) {}
            }
