name: Maintenance

on:
  schedule:
    - cron: '0 3 * * *'      # Quotidien 3h → cleanup releases
    - cron: '0 0 * * 0'      # Dimanche minuit → cleanup branches
    - cron: '30 1 * * *'     # Quotidien 1h30 → stale
  workflow_dispatch:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ============================================================
  # FORMAT AUTO — sur chaque push main
  # ============================================================
  format:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          npm install --no-save prettier
          sudo apt-get install -y shfmt

      - name: Run formatters
        run: |
          npx prettier --write "**/*.{md,yml,yaml,json}" --ignore-path .gitignore || true
          find . -name "*.sh" -exec shfmt -w -i 2 -ci {} \; || true

      - name: Auto-commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-format [skip ci]"
          file_pattern: "*.md *.yml *.yaml *.sh *.bat *.iss"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

  # ============================================================
  # CLEANUP BRANCHES — dimanche
  # ============================================================
  cleanup-branches:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const protectedNames = ['main', 'master', 'gh-pages'];
            const prBranches = prs.map(p => p.head.ref);
            let deleted = 0;
            for (const b of branches) {
              if (protectedNames.includes(b.name) || prBranches.includes(b.name)) {
                console.log(`Skip: ${b.name}`);
                continue;
              }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${b.name}`,
                });
                console.log(`Deleted: ${b.name}`);
                deleted++;
              } catch (e) {
                console.log(`Error ${b.name}: ${e.message}`);
              }
            }
            console.log(`Total deleted: ${deleted}`);

  # ============================================================
  # CLEANUP RELEASES — quotidien
  # ============================================================
  cleanup-releases:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            console.log(`Total releases: ${releases.length}`);

            const byVersion = {};
            for (const r of releases) {
              const m = r.tag_name.match(/^v?(\d+)\.(\d+)$/);
              if (m) {
                const v = m[1];
                if (!byVersion[v]) byVersion[v] = [];
                byVersion[v].push({ r, build: parseInt(m[2], 10) });
              }
            }

            for (const v in byVersion) {
              const group = byVersion[v].sort((a, b) => b.build - a.build);
              console.log(`Version ${v}: ${group.length} release(s)`);
              for (let i = 1; i < group.length; i++) {
                try {
                  await github.rest.repos.deleteRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: group[i].r.id,
                  });
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `tags/${group[i].r.tag_name}`,
                  });
                  console.log(`Deleted: ${group[i].r.tag_name}`);
                } catch (e) {
                  console.log(`Error ${group[i].r.tag_name}: ${e.message}`);
                }
              }
            }

  # ============================================================
  # STALE — quotidien
  # ============================================================
  stale:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: |
            👋 Cette issue est inactive depuis 30 jours.
            Elle sera fermée automatiquement dans 7 jours si aucun commentaire n'est ajouté.
          stale-pr-message: |
            👋 Cette PR est inactive depuis 30 jours.
            Elle sera fermée automatiquement dans 7 jours si aucun commentaire n'est ajouté.
          close-issue-message: "Issue fermée automatiquement (inactivité)."
          close-pr-message: "PR fermée automatiquement (inactivité)."
          days-before-stale: 30
          days-before-close: 7
          exempt-issue-labels: 'pinned,security,bug'
          exempt-pr-labels: 'pinned,security,bug'

  # ============================================================
  # WELCOME — première issue / PR
  # ============================================================
  welcome:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Merci d'avoir ouvert ta première Issue !

            Un mainteneur va te répondre dès que possible.
            En attendant, vérifie bien que tu as précisé :
            - Ton système d'exploitation (Windows, Linux, macOS)
            - La version de l'installateur utilisée
            - Le message d'erreur complet
          pr-message: |
            🎉 Merci pour ta première Pull Request !

            Les tests automatiques vont se lancer.
            Si tout est vert, un mainteneur la relira très vite.
            Merci de contribuer au projet !

  # ============================================================
  # LABEL PR — auto-labellisation
  # ============================================================
  label-pr:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
