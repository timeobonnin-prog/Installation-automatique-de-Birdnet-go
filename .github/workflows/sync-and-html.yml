name: Clean Releases + Update HTML

on:
  schedule:
    - cron: "55 15 * * *"
  workflow_dispatch:
  release:
    types: [published, edited, deleted]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  cleanup-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Nettoyage des miroirs et tri par version officielle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCAL: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import os, re, json, subprocess

          repo = os.environ["LOCAL"]
          
          # Récupère toutes les releases via l'API GitHub
          raw = subprocess.check_output(["gh", "api", f"repos/{repo}/releases?per_page=100", "--paginate"]).decode()
          releases = json.loads(raw)

          # Regex pour tes versions : v<officiel>.<build> ou nightly-v<officiel>.<build>
          pattern = re.compile(r'^(nightly-v|v)([^.]+)\.(\d+)$')

          grouped = {}
          to_delete = []

          for r in releases:
              tag = r["tag_name"]
              
              # 1. On ne touche jamais aux versions manuelles
              if tag.startswith("manual-"):
                  print(f"[CONSERVÉ - Manuel] {tag}")
                  continue

              match = pattern.match(tag)
              if not match:
                  # 2. Tout ce qui ne correspond pas à ton format (ex: 3496620, 20261031...) est un miroir -> suppression
                  print(f"[À SUPPRIMER - Miroir/Non-conforme] {tag}")
                  to_delete.append(tag)
              else:
                  prefix, base_ver, build_str = match.groups()
                  build_num = int(build_str)
                  key = f"{prefix}{base_ver}" # Ex: "v20261031" ou "nightly-v20261101"
                  grouped.setdefault(key, []).append((build_num, tag))

          # 3. Pour chaque version officielle, on ne garde que le build le plus élevé
          for key, items in grouped.items():
              items.sort(key=lambda x: x[0], reverse=True) # Trie du plus grand build au plus petit
              best_build, best_tag = items[0]
              print(f"[CONSERVÉ - Dernier build de {key}] {best_tag}")
              
              for old_build, old_tag in items[1:]:
                  print(f"[À SUPPRIMER - Ancien build de {key}] {old_tag}")
                  to_delete.append(old_tag)

          # Exécution des suppressions
          for tag in to_delete:
              print(f"Suppression définitive de {tag}...")
              subprocess.run(["gh", "release", "delete", tag, "--repo", repo, "--yes", "--cleanup-
