name: Sync Upstream + Update HTML

on:
  schedule:
    - cron: "55 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sync releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: tphakala/birdnet-go
          LOCAL: ${{ github.repository }}
        run: |
          set -e
          STABLE=$(gh release list --repo "$UPSTREAM" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          
          # On ignore "manifest" et on ne garde que les vraies nightlies avec une date
          NIGHTLY_RAW=$(gh release list --repo "$UPSTREAM" --exclude-drafts --pre-releases --limit 50 --json tagName -q '.[].tagName' | grep -E '^nightly-[0-9]{8}$' | head -n 1 || true)
          
          KEEP="$STABLE"
          if [ -n "$NIGHTLY_RAW" ]; then
            KEEP="$KEEP $NIGHTLY_RAW"
          fi
          
          echo "À conserver : $KEEP"

          # Supprime les vieilles releases officielles (sauf celles qu'on garde)
          LOCAL_TAGS=$(gh api "repos/$LOCAL/releases?per_page=100" --jq '.[].tag_name' | grep -vE '^(v|manual-|nightly-v)' || echo "")
          for tag in $LOCAL_TAGS; do
            if ! echo "$KEEP" | tr ' ' '\n' | grep -qx "$tag"; then
              echo "Suppression upstream : $tag"
              gh release delete "$tag" --repo "$LOCAL" --yes --cleanup-tag || true
            fi
          done

          # Crée les releases manquantes
          for tag in $KEEP; do
            IS_PRE="false"
            if [ "$tag" = "$NIGHTLY_RAW" ]; then IS_PRE="true"; fi
            if ! gh release view "$tag" --repo "$LOCAL" >/dev/null 2>&1; then
              if [ "$IS_PRE" = "true" ]; then
                gh release create "$tag" --repo "$LOCAL" --title "Nightly $tag" --notes "Miroir nightly" --prerelease --latest=false
              else
                gh release create "$tag" --repo "$LOCAL" --title "Stable $tag" --notes "Miroir stable" --latest=false
              fi
            fi
          done

  update-html:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate > releases.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate index.html
        run: python3 generate_html.py
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Aucun changement"
          else
            git commit -m "chore: update index.html [skip ci]"
            git push || true
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
