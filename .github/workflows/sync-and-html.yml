name: Clean Releases + Update HTML

on:
  schedule:
    - cron: "55 15 * * *"
  workflow_dispatch:
  release:
    types: [published, edited, deleted]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  cleanup-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Nettoyage de mes anciennes releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCAL: ${{ github.repository }}
        run: |
          set -e
          # Récupère votre dernière version stable (commençant par v, ex: v20261031.100)
          LAST_STABLE=$(gh release list --repo "$LOCAL" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName' || echo "")

          # Récupère votre dernière nightly (commençant par nightly-v)
          LAST_NIGHTLY=$(gh release list --repo "$LOCAL" --exclude-drafts --pre-releases --limit 20 --json tagName -q '.[].tagName' | grep -E '^nightly-v' | head -n 1 || echo "")

          KEEP="$LAST_STABLE $LAST_NIGHTLY"
          echo "Versions conservées : $KEEP"

          # Supprime vos anciennes releases (sauf les manuelles, la dernière stable et la dernière nightly)
          ALL_LOCAL_TAGS=$(gh api "repos/$LOCAL/releases?per_page=100" --jq '.[].tag_name' | grep -vE '^manual-' || echo "")

          for tag in $ALL_LOCAL_TAGS; do
            if ! echo "$KEEP" | tr ' ' '\n' | grep -qx "$tag"; then
              echo "Suppression de l'ancienne release : $tag"
              gh release delete "$tag" --repo "$LOCAL" --yes --cleanup-tag || true
            fi
          done

  update-html:
    needs: cleanup-releases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate > releases.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate index.html
        run: python3 generate_html.py

      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Aucun changement sur index.html"
          else
            git commit -m "chore: update index.html [skip ci]"
            git push || true
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
