name: Sync Upstream + Update HTML

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# La clé est ici : on ne veut JAMAIS annuler un déploiement en cours
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: tphakala/birdnet-go
          LOCAL: ${{ github.repository }}
        run: |
          set -e

          echo "============================================================"
          echo " 1. Récupération de la dernière stable upstream"
          echo "============================================================"
          STABLE=$(gh api "repos/$UPSTREAM/releases/latest" --jq '.tag_name')
          echo "Stable : $STABLE"

          echo ""
          echo "============================================================"
          echo " 2. Récupération des 2 dernières nightly"
          echo "============================================================"
          NIGHTLIES=$(gh api "repos/$UPSTREAM/releases?per_page=30" \
            --jq '[.[] | select(.prerelease == true)][0:2][].tag_name' || true)
          echo "Nightlies : $NIGHTLIES"

          echo ""
          echo "============================================================"
          echo " 3. Liste des releases à conserver"
          echo "============================================================"
          KEEP="$STABLE"
          for n in $NIGHTLIES; do KEEP="$KEEP $n"; done
          echo "À conserver : $KEEP"

          echo ""
          echo "============================================================"
          echo " 4. Suppression des anciennes releases upstream"
          echo "    (uniquement les tags numériques purs, ex: 20261031)"
          echo "============================================================"
          LOCAL_TAGS=$(gh api "repos/$LOCAL/releases?per_page=100" \
            --jq '.[].tag_name' | grep -E '^[0-9]+$' || echo "")

          for tag in $LOCAL_TAGS; do
            if ! echo "$KEEP" | tr ' ' '\n' | grep -qx "$tag"; then
              echo "Suppression : $tag"
              gh release delete "$tag" --repo "$LOCAL" --yes --cleanup-tag || true
            fi
          done

          echo ""
          echo "============================================================"
          echo " 5. Création / mise à jour des releases à conserver"
          echo "============================================================"
          for tag in $KEEP; do
            IS_PRE="false"
            if echo "$NIGHTLIES" | tr ' ' '\n' | grep -qx "$tag"; then
              IS_PRE="true"
            fi

            if gh release view "$tag" --repo "$LOCAL" >/dev/null 2>&1; then
              EXIST=$(gh release view "$tag" --repo "$LOCAL" \
                --json assets --jq '.assets | length')
              if [ "$EXIST" -gt 0 ]; then
                echo "Skip $tag (assets déjà présents)"
                continue
              fi
              echo "Mise à jour de $tag (assets manquants)"
            else
              echo "Création de $tag (prerelease=$IS_PRE)"
              if [ "$IS_PRE" = "true" ]; then
                gh release create "$tag" --repo "$LOCAL" \
                  --title "Nightly $tag" \
                  --notes "Miroir nightly de [birdnet-go $tag](https://github.com/$UPSTREAM/releases/tag/$tag)" \
                  --prerelease --latest=false
              else
                gh release create "$tag" --repo "$LOCAL" \
                  --title "Stable $tag" \
                  --notes "Miroir stable de [birdnet-go $tag](https://github.com/$UPSTREAM/releases/tag/$tag)" \
                  --latest=false
              fi
            fi

            echo "  → Téléchargement des assets Windows..."
            TMPDIR=$(mktemp -d)
            gh release download "$tag" --repo "$UPSTREAM" --dir "$TMPDIR" \
              --pattern "*windows*" --clobber || true

            if [ -n "$(ls -A $TMPDIR 2>/dev/null)" ]; then
              for f in "$TMPDIR"/*; do
                [ -f "$f" ] || continue
                echo "    Upload $(basename "$f")"
                gh release upload "$tag" "$f" --repo "$LOCAL" --clobber || true
              done
            else
              echo "    ⚠️ Aucun asset Windows trouvé"
            fi
            rm -rf "$TMPDIR"
          done

          echo ""
          echo "============================================================"
          echo " ✅ Synchronisation terminée"
          echo "============================================================"

  update-html:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --paginate > releases.json
          echo "Releases récupérées :"
          python3 -c "import json; [print(f'  - {r[\"tag_name\"]} ({\"nightly\" if r[\"prerelease\"] else \"stable\"})') for r in json.load(open('releases.json'))]"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate index.html
        run: python3 generate_html.py

      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Aucun changement dans index.html"
          else
            git commit -m "chore: update index.html [skip ci]"
            git push || true
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      # ✅ L'action est mise à jour vers v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
