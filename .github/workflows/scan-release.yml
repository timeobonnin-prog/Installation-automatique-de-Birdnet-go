name: Scan Latest Release with VirusTotal

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_run:
    workflows:
      - "Update BirdNET-Go Version"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest release info
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release view --repo ${{ github.repository }} --json tagName --jq '.tagName')
          echo "tag=$LATEST" >> $GITHUB_OUTPUT
          echo "Dernière release : $LATEST"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          cd assets
          gh release download ${{ steps.release.outputs.tag }} --repo ${{ github.repository }} --pattern "*.exe" --pattern "*.deb" --pattern "*.pkg" || true
          ls -la

      - name: Scan with VirusTotal
        id: scan
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then echo "Pas de clé API."; exit 0; fi
          
          FILES=("assets/BirdNET-Go-Windows.exe" "assets/BirdNET-Go-Linux-x64.deb" "assets/BirdNET-Go-RaspberryPi.deb" "assets/BirdNET-Go-macOS.pkg")
          declare -A HASHES
          
          for FILE in "${FILES[@]}"; do
            if [ ! -f "$FILE" ]; then continue; fi
            FILE_NAME=$(basename "$FILE")
            echo "🔍 Traitement de $FILE_NAME..."
            
            HASH=$(sha256sum "$FILE" | cut -d ' ' -f 1)
            HASHES["$FILE_NAME"]="$HASH"
            LOOKUP="https://www.virustotal.com/api/v3/files/$HASH"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "x-apikey: $VT_API_KEY" "$LOOKUP")
            
            if [ "$HTTP_STATUS" -eq 404 ]; then
              echo "  Fichier inconnu. Demande d'URL d'upload spéciale..."
              UPLOAD_URL=$(curl -s -H "x-apikey: $VT_API_KEY" "https://www.virustotal.com/api/v3/files/upload_url" | jq -r .data)
              curl -s -X POST "$UPLOAD_URL" -H "x-apikey: $VT_API_KEY" -F "file=@$FILE" > /dev/null
              sleep 30
            else
              echo "  Fichier déjà connu de VirusTotal."
            fi
            sleep 15
          done
          
          echo "WIN_HASH=${HASHES[BirdNET-Go-Windows.exe]}" >> $GITHUB_OUTPUT
          echo "LINUX_HASH=${HASHES[BirdNET-Go-Linux-x64.deb]}" >> $GITHUB_OUTPUT
          echo "PI_HASH=${HASHES[BirdNET-Go-RaspberryPi.deb]}" >> $GITHUB_OUTPUT
          echo "MAC_HASH=${HASHES[BirdNET-Go-macOS.pkg]}" >> $GITHUB_OUTPUT

      - name: Update release description with VirusTotal links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit ${{ steps.release.outputs.tag }} --repo ${{ github.repository }} --notes "$(cat <<EOF
          <p align="center">
            <img src="https://raw.githubusercontent.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/main/logo.png" width="150" alt="Logo">
          </p>

          ### 🪶 BirdNET-Go Multi-Plateformes

          | Plateforme | Téléchargement | Analyse VirusTotal |
          | :--- | :--- | :--- |
          | 🪟 **Windows** | [Télécharger (.exe)](https://github.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/releases/latest/download/BirdNET-Go-Windows.exe) | [🔍 Rapport](https://www.virustotal.com/gui/file/${{ steps.scan.outputs.WIN_HASH }}) |
          | 🐧 **Linux (PC)** | [Télécharger (.deb)](https://github.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/releases/latest/download/BirdNET-Go-Linux-x64.deb) | [🔍 Rapport](https://www.virustotal.com/gui/file/${{ steps.scan.outputs.LINUX_HASH }}) |
          | 🍓 **Raspberry Pi** | [Télécharger (.deb)](https://github.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/releases/latest/download/BirdNET-Go-RaspberryPi.deb) | [🔍 Rapport](https://www.virustotal.com/gui/file/${{ steps.scan.outputs.PI_HASH }}) |
          | 🍎 **macOS** | [Télécharger (.pkg)](https://github.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/releases/latest/download/BirdNET-Go-macOS.pkg) | [🔍 Rapport](https://www.virustotal.com/gui/file/${{ steps.scan.outputs.MAC_HASH }}) |

          ---

          ### #️⃣ Empreintes SHA-256

          - **Windows :** `${{ steps.scan.outputs.WIN_HASH }}`
          - **Linux :** `${{ steps.scan.outputs.LINUX_HASH }}`
          - **Raspberry Pi :** `${{ steps.scan.outputs.PI_HASH }}`
          - **macOS :** `${{ steps.scan.outputs.MAC_HASH }}`
          EOF
          )"

      - name: Delete assets downloaded locally
        run: rm -rf assets