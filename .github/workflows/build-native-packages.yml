name: Build Native Packages (Linux, ARM, Mac)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v-*'

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb (Linux & Raspberry Pi)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Get Latest BirdNET-Go Version
        id: version
        run: |
          TAG=$(curl -s https://api.github.com/repos/tphakala/birdnet-go/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download BirdNET-Go Binary
        run: |
          mkdir -p dist
          ARCH_NAME="${{ matrix.arch }}"
          URL="https://github.com/tphakala/birdnet-go/releases/download/${{ steps.version.outputs.tag }}/birdnet-go-linux-${ARCH_NAME}-${{ steps.version.outputs.tag }}.tar.gz"
          curl -fsSL -o birdnet.tar.gz "$URL"
          tar -xzf birdnet.tar.gz -C dist
          find dist -name "birdnet-go" -type f -exec mv {} dist/ \;
          chmod +x dist/birdnet-go

      - name: Install NFPM
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt update
          sudo apt install nfpm -y

      - name: Build .deb package
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          sed -i "s/\${ARCH}/${ARCH}/g" nfpm.yaml
          sed -i "s/\${VERSION}/${VERSION}/g" nfpm.yaml
          nfpm package -p deb -f nfpm.yaml

      - name: Upload .deb to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: "*.deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-pkg:
    name: Build .pkg (macOS)
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Get Latest BirdNET-Go Version
        id: version
        run: |
          TAG=$(curl -s https://api.github.com/repos/tphakala/birdnet-go/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download BirdNET-Go Binary
        run: |
          mkdir -p payload/usr/local/bin
          ARCH_NAME="${{ matrix.arch }}"
          URL="https://github.com/tphakala/birdnet-go/releases/download/${{ steps.version.outputs.tag }}/birdnet-go-darwin-${ARCH_NAME}-${{ steps.version.outputs.tag }}.tar.gz"
          curl -fsSL -o birdnet.tar.gz "$URL"
          tar -xzf birdnet.tar.gz -C payload/usr/local/bin
          find payload/usr/local/bin -name "birdnet-go" -type f -exec mv {} payload/usr/local/bin/ \;
          chmod +x payload/usr/local/bin/birdnet-go

      - name: Build .pkg
        run: |
          pkgbuild --root payload \
                   --identifier com.github.timeobonnin.birdnetgo \
                   --version ${{ steps.version.outputs.tag }} \
                   --install-location / \
                   "BirdNET-Go-macOS-${{ matrix.arch }}.pkg"

      - name: Upload .pkg to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: "*.pkg"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
