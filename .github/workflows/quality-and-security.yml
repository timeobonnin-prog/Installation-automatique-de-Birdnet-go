  notify-telegram:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer un message sur Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Secrets Telegram manquants, on ignore."
            exit 0
          fi

          if [ "$IS_PRERELEASE" = "true" ]; then
            TITLE="🌙 Nouvelle Nightly disponible !"
          else
            TITLE="🚀 Nouvelle Version Stable disponible !"
          fi

          MESSAGE="$TITLE
La version **$RELEASE_NAME** vient d'être publiée.
[Télécharger ici]($RELEASE_URL)"

          # Envoi du message via l'API Telegram (curl + jq)
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" '{chat_id: $chat_id, text: $text, parse_mode: "Markdown"}')"
