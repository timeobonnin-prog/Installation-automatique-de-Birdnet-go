name: Quality, Security & Notifications

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================================
  # JOB 1 : LINT
  # ============================================================
  lint-code:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile generate_html.py
      - run: |
          pip install yamllint
          yamllint .github/workflows/ || true
      - shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($results) { $results | Format-Table -AutoSize; exit 1 }

  # ============================================================
  # JOB 2 : TEST WINDOWS (.exe)
  # ============================================================
  test-windows:
    name: Test de l'installateur Windows (.exe)
    needs: lint-code
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger l'installateur
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          if ! gh release download --repo ${{ github.repository }} --pattern "BirdNET-Go-Windows.exe" --dir "dist" --clobber; then
            echo "⚠️ Pas d'installateur Windows dans la release, test ignoré."
            exit 0
          fi
      - name: Installer et Tester
        run: |
          Start-Process -FilePath "dist\BirdNET-Go-Windows.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -PassThru | Out-Null
          Start-Sleep -Seconds 60
          Get-Process -Name "BirdNET-Go-Windows", "Setup" -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = "$env:LOCALAPPDATA\BirdNET-Go\birdnet-go.exe"
          if (Test-Path $exe) {
            Start-Process -FilePath $exe -ArgumentList "serve" -WorkingDirectory (Split-Path $exe) -WindowStyle Hidden
            for ($i=0; $i -lt 30; $i++) {
              try { $r = Invoke-WebRequest -Uri "http://localhost:8080" -UseBasicParsing -TimeoutSec 2; exit 0 } catch { Start-Sleep -Seconds 2 }
            }
            Write-Host "❌ Le serveur Windows ne répond pas après 60s."; exit 1
          } else { Write-Host "❌ Installation échouée."; exit 1 }

  # ============================================================
  # JOB 3 : TEST LINUX (.deb)
  # ============================================================
  test-linux:
    name: Test du paquet Linux x64 (.deb)
    needs: lint-code
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger le paquet
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          if ! gh release download --repo ${{ github.repository }} --pattern "BirdNET-Go-Linux-x64.deb" --clobber; then
            if gh release view --repo ${{ github.repository }} --json assets -q '.assets[].name' | grep -q "BirdNET-Go-Linux-x64.deb"; then
              echo "❌ Le fichier existe mais le téléchargement a échoué."; exit 1
            else
              echo "⚠️ Le fichier n'existe pas dans la release."; exit 0
            fi
          fi
      - name: Installer et Tester
        run: |
          sudo dpkg -i BirdNET-Go-Linux-x64.deb || sudo apt-get install -f -y
          export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          /usr/local/bin/birdnet-go serve > /tmp/birdnet.log 2>&1 &
          SERVER_PID=$!
          for i in {1..30}; do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "❌ Le serveur Linux a planté."; cat /tmp/birdnet.log; exit 1
            fi
            HTTP_CODE=$(curl -s --max-time 2 -o /dev/null -w "%{http_code}" http://localhost:8080 || echo "000")
            if [ "$HTTP_CODE" == "200" ]; then echo "✅ Le serveur Linux répond !"; kill $SERVER_PID 2>/dev/null; exit 0; fi
            sleep 2
          done
          echo "❌ Le serveur Linux ne répond pas après 60s."; cat /tmp/birdnet.log; kill $SERVER_PID 2>/dev/null; exit 1

  # ============================================================
  # JOB 4 : TEST MACOS (.pkg)
  # ============================================================
  test-macos:
    name: Test du paquet macOS (.pkg)
    needs: lint-code
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger le paquet
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          if ! gh release download --repo ${{ github.repository }} --pattern "BirdNET-Go-macOS.pkg" --clobber; then
            if gh release view --repo ${{ github.repository }} --json assets -q '.assets[].name' | grep -q "BirdNET-Go-macOS.pkg"; then
              echo "❌ Le fichier existe mais le téléchargement a échoué."; exit 1
            else
              echo "⚠️ Le fichier n'existe pas dans la release."; exit 0
            fi
          fi
      - name: Installer et Tester
        run: |
          sudo installer -pkg BirdNET-Go-macOS.pkg -target /
          /usr/local/bin/birdnet-go serve > /tmp/birdnet.log 2>&1 &
          SERVER_PID=$!
          for i in {1..30}; do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "❌ Le serveur macOS a planté."; cat /tmp/birdnet.log; exit 1
            fi
            HTTP_CODE=$(curl -s --max-time 2 -o /dev/null -w "%{http_code}" http://localhost:8080 || echo "000")
            if [ "$HTTP_CODE" == "200" ]; then echo "✅ Le serveur macOS répond !"; kill $SERVER_PID 2>/dev/null; exit 0; fi
            sleep 2
          done
          echo "❌ Le serveur macOS ne répond pas après 60s."; cat /tmp/birdnet.log; kill $SERVER_PID 2>/dev/null; exit 1

  # ============================================================
  # JOB 5 : TEST RASPBERRY PI (.deb)
  # ============================================================
  test-raspberry:
    name: Test du paquet Raspberry Pi (.deb)
    needs: lint-code
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger le paquet
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          if ! gh release download --repo ${{ github.repository }} --pattern "BirdNET-Go-RaspberryPi.deb" --clobber; then
            if gh release view --repo ${{ github.repository }} --json assets -q '.assets[].name' | grep -q "BirdNET-Go-RaspberryPi.deb"; then
              echo "❌ Le fichier existe mais le téléchargement a échoué."; exit 1
            else
              echo "⚠️ Le fichier n'existe pas dans la release."; exit 0
            fi
          fi
      - name: Tester dans QEMU
        uses: pguyot/arm-runner-action@v2.6.5
        continue-on-error: true
        with:
          base_image: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2024-11-19/2024-11-19-raspios-bookworm-arm64-lite.img.xz
          cpu: cortex-a72
          copy_artifact_path: BirdNET-Go-RaspberryPi.deb
          copy_artifact_dest: /tmp/
          commands: |
            sudo dpkg -i --force-all /tmp/BirdNET-Go-RaspberryPi.deb || true
            export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
            /usr/local/bin/birdnet-go serve > /tmp/birdnet.log 2>&1 &
            SERVER_PID=$!
            for i in {1..30}; do
              HTTP_CODE=$(curl -s --max-time 2 -o /dev/null -w "%{http_code}" http://localhost:8080 || echo "000")
              if [ "$HTTP_CODE" == "200" ]; then exit 0; fi
              sleep 2
            done
            exit 1

  # ============================================================
  # JOB 6 : SÉCURITÉ CODEQL
  # ============================================================
  codeql-analysis:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: python }
      - uses: github/codeql-action/analyze@v3

  # ============================================================
  # JOB 7 : NOTIFICATION TELEGRAM
  # ============================================================
  notify-telegram:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer un message sur Telegram
        uses: actions/github-script@v7
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          script: |
            const token = process.env.TELEGRAM_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT;
            const release = context.payload.release;
            if (!token || !chatId) return;
            const title = release.prerelease ? "🌙 Nouvelle Nightly !" : "🚀 Nouvelle Stable !";
            const message = `${title}\n\nVersion *${release.name}*\n[Télécharger ici](${release.html_url})`;
            await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: 'Markdown' })
            });
