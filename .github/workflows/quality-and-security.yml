name: Quality, Security & Notifications

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================================
  # JOB 1 : VÉRIFICATION DU CODE (Lint)
  # ============================================================
  lint-code:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Vérifier le Python
        run: python -m py_compile generate_html.py
          
      - name: Vérifier le YAML
        run: |
          pip install yamllint
          yamllint .github/workflows/ || true
          
      - name: Vérifier le PowerShell
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }

  # ============================================================
  # JOB 2 : TEST DE L'INSTALLATEUR (Corrigé et blindé)
  # ============================================================
  test-installer:
    needs: lint-code
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 15 # Si ça bloque, ça s'arrête au bout de 15 min max
    steps:
      - uses: actions/checkout@v4
      
      - name: Télécharger le dernier installateur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo ${{ github.repository }} --pattern "BirdNET-Go-Windows.exe" --dir "dist" --clobber
          
      - name: Vérifier le fichier téléchargé
        run: |
          if (-Not (Test-Path "dist\BirdNET-Go-Windows.exe")) {
            Write-Host "Pas d'installateur trouvé. On annule le test."
            exit 0
          }
          $size = (Get-Item "dist\BirdNET-Go-Windows.exe").Length / 1MB
          Write-Host "Taille de l'installateur : $([math]::Round($size, 2)) MB"
          if ($size -lt 10) {
            Write-Error "Le fichier semble trop petit pour être un vrai installateur."
            exit 1
          }

      - name: Installer silencieusement SANS -Wait
        run: |
          # On lance l'installateur sans -Wait (sinon il attend que le serveur s'arrête... indéfiniment)
          $process = Start-Process -FilePath "dist\BirdNET-Go-Windows.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -PassThru
          
          # On attend maximum 5 minutes (300 secondes)
          $timeout = 300
          $elapsed = 0
          while (-not $process.HasExited -and $elapsed -lt $timeout) {
            Start-Sleep -Seconds 5
            $elapsed += 5
            Write-Host "Attente de l'installation... ($elapsed/$timeout sec)"
          }
          
          if (-not $process.HasExited) {
            Write-Host "❌ L'installation a bloqué. On force l'arrêt."
            Stop-Process -Id $process.Id -Force
            exit 1
          }
          
          Write-Host "✅ L'installateur a terminé avec le code de sortie : $($process.ExitCode)"
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) { exit 1 }

      - name: Vérifier que le serveur démarre
        run: |
          $exe = "$env:LOCALAPPDATA\BirdNET-Go\birdnet-go.exe"
          if (Test-Path $exe) {
            Write-Host "✅ Le fichier a bien été installé."
            Start-Process -FilePath $exe -ArgumentList "serve" -WorkingDirectory (Split-Path $exe) -WindowStyle Hidden
            Start-Sleep -Seconds 5
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:8080" -UseBasicParsing -TimeoutSec 5
              Write-Host "✅ Le serveur répond avec le code : $($r.StatusCode)"
            } catch {
              Write-Host "❌ Le serveur ne répond pas."
              exit 1
            }
          } else {
            Write-Host "❌ Le fichier n'a pas été installé au bon endroit."
            exit 1
          }

  # ============================================================
  # JOB 3 : NOTIFICATION TELEGRAM
  # ============================================================
  notify-telegram:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer un message sur Telegram
        uses: actions/github-script@v7
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          script: |
            const token = process.env.TELEGRAM_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT;
            const release = context.payload.release;
            
            if (!token || !chatId) {
              console.log("Secrets Telegram manquants, on ignore.");
              return;
            }

            const title = release.prerelease ? "🌙 Nouvelle Nightly disponible !" : "🚀 Nouvelle Version Stable disponible !";
            const message = `${title}\n\nLa version *${release.name}* vient d'être publiée.\n[Télécharger ici](${release.html_url})`;

            const url = `https://api.telegram.org/bot${token}/sendMessage`;
            
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id: chatId,
                text: message,
                parse_mode: 'Markdown'
              })
            });

            if (!response.ok) {
              const errorText = await response.text();
              core.setFailed(`Erreur Telegram : ${errorText}`);
            } else {
              console.log("✅ Message Telegram envoyé avec succès !");
            }

  # ============================================================
  # JOB 4 : SÉCURITÉ CODEQL
  # ============================================================
  codeql-analysis:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
