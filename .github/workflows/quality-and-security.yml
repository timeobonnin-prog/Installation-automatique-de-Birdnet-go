name: Quality, Security & Notifications

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================================
  # JOB 1 : LINT
  # ============================================================
  lint-code:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile generate_html.py
      - run: |
          pip install yamllint
          yamllint .github/workflows/ || true
      - shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($results) { $results | Format-Table -AutoSize; exit 1 }

  # ============================================================
  # JOB 2 : TEST WINDOWS (.exe)
  # ============================================================
  test-windows:
    name: Test de l'installateur Windows (.exe)
    needs: lint-code
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger l'installateur
        shell: pwsh
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release download --repo ${{ github.repository }} --pattern "BirdNET-Go-Windows.exe" --dir "dist" --clobber
      - name: Installer et Tester
        run: |
          if (Test-Path "dist\BirdNET-Go-Windows.exe") {
            Start-Process -FilePath "dist\BirdNET-Go-Windows.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -PassThru | Out-Null
            Start-Sleep -Seconds 60
            Get-Process -Name "BirdNET-Go-Windows", "Setup" -ErrorAction SilentlyContinue | Stop-Process -Force
            $exe = "$env:LOCALAPPDATA\BirdNET-Go\birdnet-go.exe"
            if (Test-Path $exe) {
              # On vérifie que le binaire s'exécute bien (pas de --version, mais authors)
              & $exe authors
              if ($LASTEXITCODE -eq 0) {
                Write-Host "✅ Le binaire Windows s'exécute correctement."
              } else {
                Write-Host "❌ Le binaire Windows ne s'exécute pas."
                exit 1
              }
            } else { Write-Host "❌ Installation échouée."; exit 1 }
          } else { Write-Host "⚠️ Pas d'installateur Windows dans la release."; exit 0 }

  # ============================================================
  # JOB 3 : TEST LINUX (.deb)
  # ============================================================
  test-linux:
    name: Test du paquet Linux x64 (.deb)
    needs: lint-code
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger le paquet
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release download --repo ${{ github.repository }} --pattern "BirdNET-Go-Linux-x64.deb" --clobber || true
      - name: Installer et Tester
        run: |
          if [ -f "BirdNET-Go-Linux-x64.deb" ]; then
            sudo dpkg -i BirdNET-Go-Linux-x64.deb || sudo apt-get install -f -y
            export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
            # On utilise 'authors' car '--version' n'existe pas
            /usr/local/bin/birdnet-go authors
            echo "✅ Le binaire Linux s'exécute correctement."
          else
            echo "⚠️ Pas de paquet Linux dans la release, test ignoré."
          fi

  # ============================================================
  # JOB 4 : TEST MACOS (.pkg)
  # ============================================================
  test-macos:
    name: Test du paquet macOS (.pkg)
    needs: lint-code
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger le paquet
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release download --repo ${{ github.repository }} --pattern "BirdNET-Go-macOS.pkg" --clobber || true
      - name: Installer et Tester
        run: |
          if [ -f "BirdNET-Go-macOS.pkg" ]; then
            sudo installer -pkg BirdNET-Go-macOS.pkg -target /
            /usr/local/bin/birdnet-go authors
            echo "✅ Le binaire macOS s'exécute correctement."
          else
            echo "⚠️ Pas de paquet macOS dans la release, test ignoré."
          fi

  # ============================================================
  # JOB 5 : TEST RASPBERRY PI (.deb)
  # ============================================================
  test-raspberry:
    name: Test du paquet Raspberry Pi (.deb)
    needs: lint-code
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger le paquet
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release download --repo ${{ github.repository }} --pattern "BirdNET-Go-RaspberryPi.deb" --clobber || true
      - name: Tester dans QEMU
        uses: pguyot/arm-runner-action@v2.6.5
        continue-on-error: true
        with:
          base_image: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2024-11-19/2024-11-19-raspios-bookworm-arm64-lite.img.xz
          cpu: cortex-a72
          copy_artifact_path: BirdNET-Go-RaspberryPi.deb
          copy_artifact_dest: /tmp/
          commands: |
            if [ -f "/tmp/BirdNET-Go-RaspberryPi.deb" ]; then
              sudo dpkg -i --force-all /tmp/BirdNET-Go-RaspberryPi.deb || true
              export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
              /usr/local/bin/birdnet-go authors
              echo "✅ Le binaire Raspberry Pi s'exécute correctement."
            fi

  # ============================================================
  # JOB 6 : SÉCURITÉ CODEQL
  # ============================================================
  codeql-analysis:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: python }
      - uses: github/codeql-action/analyze@v3

  # ============================================================
  # JOB 7 : NOTIFICATION TELEGRAM
  # ============================================================
  notify-telegram:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer un message sur Telegram
        uses: actions/github-script@v7
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          script: |
            const token = process.env.TELEGRAM_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT;
            const release = context.payload.release;
            if (!token || !chatId) return;
            const title = release.prerelease ? "🌙 Nouvelle Nightly !" : "🚀 Nouvelle Stable !";
            const message = `${title}\n\nVersion *${release.name}*\n[Télécharger ici](${release.html_url})`;
            await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: 'Markdown' })
            });
