name: Quality, Security & Notifications

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================================
  # JOB 1 : VÉRIFICATION DU CODE (Lint)
  # ============================================================
  lint-code:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le Python
        run: python -m py_compile generate_html.py

      - name: Vérifier le YAML
        run: |
          pip install yamllint
          yamllint .github/workflows/ || true

      - name: Vérifier le PowerShell
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }

  # ============================================================
  # JOB 2 : TEST DE L'INSTALLATEUR (Version Blindée à 60s)
  # ============================================================
  test-installer:
    needs: lint-code
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger le dernier installateur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo ${{ github.repository }} --pattern "BirdNET-Go-Windows.exe" --dir "dist" --clobber

      - name: Vérifier le fichier téléchargé
        run: |
          if (-Not (Test-Path "dist\BirdNET-Go-Windows.exe")) {
            Write-Host "Pas d'installateur trouvé. On annule le test."
            exit 0
          }

      - name: Lancer l'installation (Sans attendre la fin)
        run: |
          Write-Host "Lancement de l'installateur en arrière-plan..."
          # On lance sans -Wait. On ajoute /LOG pour tracer en cas de problème.
          Start-Process -FilePath "dist\BirdNET-Go-Windows.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/LOG=`"$env:TEMP\install.log`""

          Write-Host "Attente de 60 secondes pour laisser le temps à l'installation de se terminer..."
          Start-Sleep -Seconds 60

          # On tue les processus de l'installateur s'ils traînent encore
          Get-Process -Name "BirdNET-Go-Windows", "Setup", "unins000" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "Vérification de l'installation..."

      - name: Vérifier que le serveur est bien installé
        run: |
          $exe = "$env:LOCALAPPDATA\BirdNET-Go\birdnet-go.exe"
          if (Test-Path $exe) {
            Write-Host "✅ Le fichier a bien été installé."
            
            # Test de démarrage du serveur
            Start-Process -FilePath $exe -ArgumentList "serve" -WorkingDirectory (Split-Path $exe) -WindowStyle Hidden
            Start-Sleep -Seconds 5
            
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:8080" -UseBasicParsing -TimeoutSec 5
              Write-Host "✅ Le serveur répond avec le code : $($r.StatusCode)"
            } catch {
              Write-Host "❌ Le serveur ne répond pas."
              exit 1
            }
          } else {
            Write-Host "❌ Le fichier n'a pas été installé au bon endroit."
            Write-Host "Affichage du log d'installation pour debug :"
            Get-Content "$env:TEMP\install.log" -ErrorAction SilentlyContinue
            exit 1
          }

  # ============================================================
  # JOB 3 : NOTIFICATION TELEGRAM
  # ============================================================
  notify-telegram:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer un message sur Telegram
        uses: actions/github-script@v7
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          script: |
            const token = process.env.TELEGRAM_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT;
            const release = context.payload.release;

            if (!token || !chatId) {
              console.log("Secrets Telegram manquants, on ignore.");
              return;
            }

            const title = release.prerelease ? "🌙 Nouvelle Nightly disponible !" : "🚀 Nouvelle Version Stable disponible !";
            const message = `${title}\n\nLa version *${release.name}* vient d'être publiée.\n[Télécharger ici](${release.html_url})`;

            const url = `https://api.telegram.org/bot${token}/sendMessage`;

            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id: chatId,
                text: message,
                parse_mode: 'Markdown'
              })
            });

            if (!response.ok) {
              const errorText = await response.text();
              core.setFailed(`Erreur Telegram : ${errorText}`);
            } else {
              console.log("✅ Message Telegram envoyé avec succès !");
            }

  # ============================================================
  # JOB 4 : SÉCURITÉ CODEQL
  # ============================================================
  codeql-analysis:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
