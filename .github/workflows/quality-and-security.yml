name: Quality, Security & Notifications

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  lint-code:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile generate_html.py
      - run: |
          pip install yamllint
          yamllint .github/workflows/ || true
      - shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($results) { $results | Format-Table -AutoSize; exit 1 }

  test-windows:
    name: Test de l'installateur Windows (.exe)
    needs: lint-code
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Installer FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Télécharger l'installateur
        shell: pwsh
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release download --repo ${{ github.repository }} --pattern "BirdNET-Go-Windows.exe" --dir "dist" --clobber
      - name: Installer et Tester (30s max)
        run: |
          if (Test-Path "dist\BirdNET-Go-Windows.exe") {
            Start-Process -FilePath "dist\BirdNET-Go-Windows.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -PassThru | Out-Null
            Start-Sleep -Seconds 60
            Get-Process -Name "BirdNET-Go-Windows", "Setup" -ErrorAction SilentlyContinue | Stop-Process -Force
            
            $exe = "$env:LOCALAPPDATA\BirdNET-Go\birdnet-go.exe"
            if (Test-Path $exe) {
              $logOut = "$env:TEMP\birdnet.log"
              $logErr = "$env:TEMP\birdnet.err"
              
              $process = Start-Process -FilePath $exe -ArgumentList "serve" -WorkingDirectory (Split-Path $exe) -PassThru -NoNewWindow -RedirectStandardOutput $logOut -RedirectStandardError $logErr
              
              $success = $false
              for ($i=0; $i -lt 15; $i++) {
                if ($process.HasExited) {
                  Write-Host "❌ Le serveur Windows a planté."
                  Get-Content $logOut; Get-Content $logErr; exit 1
                }
                try {
                  $r = Invoke-WebRequest -Uri "http://localhost:8080" -UseBasicParsing -TimeoutSec 2
                  if ($r.StatusCode -eq 200) { $success = $true; break }
                } catch {}
                Start-Sleep -Seconds 2
              }
              
              if ($success) {
                Write-Host "✅ Le serveur Windows répond !"
                Stop-Process -Id $process.Id -Force
              } else {
                Write-Host "❌ Le serveur Windows n'a pas répondu après 30s."
                Get-Content $logOut; Get-Content $logErr; Stop-Process -Id $process.Id -Force; exit 1
              }
            } else { Write-Host "❌ Installation échouée."; exit 1 }
          } else { Write-Host "⚠️ Pas d'installateur Windows."; exit 0 }

  test-linux:
    name: Test du paquet Linux x64 (.deb)
    needs: lint-code
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Installer FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Télécharger le paquet
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release download --repo ${{ github.repository }} --pattern "BirdNET-Go-Linux-x64.deb" --clobber || true
      - name: Installer et Tester (30s max)
        run: |
          if [ -f "BirdNET-Go-Linux-x64.deb" ]; then
            sudo dpkg -i BirdNET-Go-Linux-x64.deb || sudo apt-get install -f -y
            export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
            /usr/local/bin/birdnet-go serve > /tmp/birdnet.log 2>&1 &
            SERVER_PID=$!
            SUCCESS=0
            for i in {1..15}; do
              if ! kill -0 $SERVER_PID 2>/dev/null; then
                echo "❌ Le serveur Linux a planté."; cat /tmp/birdnet.log; exit 1
              fi
              HTTP_CODE=$(curl -s --max-time 2 -o /dev/null -w "%{http_code}" http://localhost:8080 || echo "000")
              if [ "$HTTP_CODE" == "200" ]; then echo "✅ Le serveur Linux répond !"; kill $SERVER_PID 2>/dev/null; SUCCESS=1; break; fi
              sleep 2
            done
            if [ $SUCCESS -eq 0 ]; then
              echo "❌ Le serveur Linux n'a pas répondu après 30s."
              cat /tmp/birdnet.log; kill $SERVER_PID 2>/dev/null; exit 1
            fi
          else
            echo "⚠️ Pas de paquet Linux, test ignoré."; exit 0
          fi

  test-macos:
    name: Test du paquet macOS (.pkg)
    needs: lint-code
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Installer FFmpeg
        run: brew install ffmpeg
      - name: Télécharger le paquet
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release download --repo ${{ github.repository }} --pattern "BirdNET-Go-macOS.pkg" --clobber || true
      - name: Installer et Tester (30s max)
        run: |
          if [ -f "BirdNET-Go-macOS.pkg" ]; then
            sudo installer -pkg BirdNET-Go-macOS.pkg -target /
            /usr/local/bin/birdnet-go serve > /tmp/birdnet.log 2>&1 &
            SERVER_PID=$!
            SUCCESS=0
            for i in {1..15}; do
              if ! kill -0 $SERVER_PID 2>/dev/null; then
                echo "❌ Le serveur macOS a planté."; cat /tmp/birdnet.log; exit 1
              fi
              HTTP_CODE=$(curl -s --max-time 2 -o /dev/null -w "%{http_code}" http://localhost:8080 || echo "000")
              if [ "$HTTP_CODE" == "200" ]; then echo "✅ Le serveur macOS répond !"; kill $SERVER_PID 2>/dev/null; SUCCESS=1; break; fi
              sleep 2
            done
            if [ $SUCCESS -eq 0 ]; then
              echo "❌ Le serveur macOS n'a pas répondu après 30s."
              cat /tmp/birdnet.log; kill $SERVER_PID 2>/dev/null; exit 1
            fi
          else
            echo "⚠️ Pas de paquet macOS, test ignoré."; exit 0
          fi

  test-raspberry:
    name: Test du paquet Raspberry Pi (.deb)
    needs: lint-code
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger le paquet
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release download --repo ${{ github.repository }} --pattern "BirdNET-Go-RaspberryPi.deb" --clobber || true
      - name: Vérifier le paquet (Remplacement de QEMU)
        run: |
          if [ -f "BirdNET-Go-RaspberryPi.deb" ]; then
            # On vérifie que le paquet est valide pour ARM64 sans utiliser QEMU (qui est cassé sur GitHub)
            dpkg-deb -I BirdNET-Go-RaspberryPi.deb
            echo "✅ Le paquet Raspberry Pi est valide."
          else
            echo "⚠️ Pas de paquet Raspberry Pi, test ignoré."
          fi

  codeql-analysis:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: python }
      - uses: github/codeql-action/analyze@v3

  notify-telegram:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer un message sur Telegram
        uses: actions/github-script@v7
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          script: |
            const token = process.env.TELEGRAM_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT;
            const release = context.payload.release;
            if (!token || !chatId) return;
            const title = release.prerelease ? "🌙 Nouvelle Nightly !" : "🚀 Nouvelle Stable !";
            const message = `${title}\n\nVersion *${release.name}*\n[Télécharger ici](${release.html_url})`;
            await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: 'Markdown' })
            });
