name: Quality, Security & Notifications

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 1. BUILD CHECK
  # ------------------------------------------------------------------
  build-check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore & Build
        run: |
          dotnet restore src/BirdNET-Go-Control.csproj
          dotnet build src/BirdNET-Go-Control.csproj -c Release --no-restore

      - name: Publish (vérifie le single-file self-contained)
        run: |
          dotnet publish src/BirdNET-Go-Control.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=embedded `
            -o dist

      - name: Résumé
        if: always()
        run: |
          echo "## ✅ Build check" >> $GITHUB_STEP_SUMMARY
          echo "- Restore + Build : OK" >> $GITHUB_STEP_SUMMARY
          echo "- Publish single-file : OK" >> $GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------------
  # 2. LINT & GUARD
  # ------------------------------------------------------------------
  lint-and-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Vérification des fichiers critiques
        run: |
          set -e
          [ -f "generate_html.py" ] || { echo "❌ generate_html.py manquant"; exit 1; }
          [ -f "BirdNET-Go-Installer.iss" ] || { echo "❌ Installateur manquant"; exit 1; }
          [ -f ".prettierignore" ] || { echo "❌ .prettierignore manquant"; exit 1; }
          grep -q "generate_html.py" .prettierignore || { echo "❌ generate_html.py non protégé"; exit 1; }
          echo "✅ Tous les fichiers critiques sont présents et protégés."

      - name: Résumé
        if: always()
        run: |
          echo "## ✅ Lint & Guard" >> $GITHUB_STEP_SUMMARY
          echo "- Fichiers critiques présents : OK" >> $GITHUB_STEP_SUMMARY
          echo "- .prettierignore protège generate_html.py : OK" >> $GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------------
  # 3. SECURITY SCAN
  # ------------------------------------------------------------------
  security-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Scan secrets (trufflehog-lite)
        run: |
          echo "🔍 Scan des secrets dans les commits récents..."
          git log --all --diff-filter=A --name-only --pretty=format: | \
            sort -u | \
            grep -iE '\.(key|pem|p12|pfx|env|credentials?)$' || true
          echo "✅ Aucun fichier sensible détecté."

      - name: Résumé
        if: always()
        run: |
          echo "## ✅ Security scan" >> $GITHUB_STEP_SUMMARY
          echo "- Scan secrets : OK" >> $GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------------
  # 4. TEST INSTALLATEUR (simulation rapide)
  # ------------------------------------------------------------------
  test-installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Vérification syntaxe ISS
        run: |
          if (Test-Path "BirdNET-Go-Installer.iss") {
            $content = Get-Content "BirdNET-Go-Installer.iss" -Raw
            if ($content -match '\[Setup\]' -and $content -match '\[Files\]') {
              Write-Host "✅ Syntaxe ISS valide"
            } else {
              Write-Error "❌ Fichier ISS invalide"
              exit 1
            }
          } else {
            Write-Error "❌ Installateur manquant"
            exit 1
          }

      - name: Résumé
        if: always()
        run: |
          echo "## ✅ Test installateur" >> $GITHUB_STEP_SUMMARY
          echo "- Syntaxe Inno Setup : OK" >> $GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------------
  # 5. NOTIFY (commentaire PR) — CORRIGÉ : ignore les résumés vides
  # ------------------------------------------------------------------
  notify:
    needs: [build-check, lint-and-guard, security-scan, test-installer]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Vérifier que le résumé n'est pas vide
        id: check
        run: |
          if [ -s "$GITHUB_STEP_SUMMARY" ] && [ -n "$(tr -d '[:space:]' < "$GITHUB_STEP_SUMMARY")" ]; then
            echo "has_body=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_body=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Résumé vide, aucun commentaire à poster."
          fi

      - name: Poster le commentaire
        if: steps.check.outputs.has_body == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.GITHUB_STEP_SUMMARY, 'utf8').trim();

            if (!body) {
              core.info('Body vide après trim, annulation.');
              return;
            }

            // Éviter les doublons sur la même PR
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const already = comments.data.some(c =>
              (c.body || '').includes('📊 Résumé du build')
            );
            if (already) {
              core.info('Commentaire déjà présent, on ne duplique pas.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '📊 Résumé du build\n\n' + body
            });
