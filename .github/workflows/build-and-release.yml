name: Build & Release

on:
  schedule:
    - cron: "55 15 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Forcer la compilation (Stable)"
        type: boolean
        default: false
      build_nightly:
        description: "Forcer la compilation (Nightly)"
        type: boolean
        default: false
  push:
    paths:
      - "src/**"
      - "installer/BirdNET-Go-Installer.iss"
      - "installer/nfpm.yaml"
      - "assets/icon.ico"
      - "assets/logo.png"
      - "scripts/start_birdnet.bat"
      - "scripts/install-birdnet.sh"
      - "scripts/**"
      - ".github/workflows/build-and-release.yml"

permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build_stable: ${{ steps.check.outputs.build_stable }}
      build_nightly: ${{ steps.check.outputs.build_nightly }}
      stable_tag: ${{ steps.check.outputs.stable }}
      nightly_tag: ${{ steps.check.outputs.nightly }}
    steps:
      - uses: actions/checkout@v7
      - name: Check versions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STABLE=$(gh release list --repo tphakala/birdnet-go --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          HAS_STABLE=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName -q ".[] | select(.tagName | startswith(\"v$STABLE\")) | .tagName" || true)

          if [ -z "$HAS_STABLE" ] || [ "${{ github.event.inputs.force_build }}" == "true" ] || [ "${{ github.event_name }}" == "push" ]; then
            echo "build_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_stable=false" >> "$GITHUB_OUTPUT"
          fi

          NIGHTLY_RAW=$(gh release list --repo tphakala/birdnet-go --exclude-drafts --pre-releases --limit 50 --json tagName -q '.[].tagName' | grep -E '^nightly-[0-9]{8}$' | head -n 1 || true)

          if [ -n "$NIGHTLY_RAW" ]; then
            CLEAN_NIGHTLY="${NIGHTLY_RAW#nightly-}"
            echo "nightly=$CLEAN_NIGHTLY" >> "$GITHUB_OUTPUT"
            HAS_NIGHTLY=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName -q ".[] | select(.tagName | startswith(\"nightly-v$CLEAN_NIGHTLY\")) | .tagName" || true)

            if [ -z "$HAS_NIGHTLY" ] || [ "${{ github.event.inputs.force_build }}" == "true" ] || [ "${{ github.event.inputs.build_nightly }}" == "true" ]; then
              echo "build_nightly=true" >> "$GITHUB_OUTPUT"
            else
              echo "build_nightly=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "nightly=" >> "$GITHUB_OUTPUT"
            echo "build_nightly=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows-stable:
    needs: check-version
    if: needs.check-version.outputs.build_stable == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Install Inno Setup and FFmpeg
        run: |
          choco install innosetup --no-progress -y
          choco install ffmpeg --no-progress -y
      - name: Fetch BirdNET-Go
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ needs.check-version.outputs.stable_tag }}"
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/tphakala/birdnet-go/releases/tags/$tag" -Headers @{ "User-Agent" = "PowerShell"; "Authorization" = "Bearer $env:GITHUB_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -match "windows.*amd64.*\.tar\.gz" } | Select-Object -First 1

          if ($null -eq $asset) {
            Write-Error "Aucun asset Windows amd64 (.tar.gz) trouvé pour le tag $tag sur le dépôt upstream."
            exit 1
          }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "birdnet.tar.gz"
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          tar -xzf "birdnet.tar.gz" -C "dist"
          $required = @("birdnet-go.exe", "onnxruntime.dll", "tensorflowlite_c.dll")
          foreach ($f in $required) {
            if (-not (Test-Path "dist\$f")) { Write-Error "Manquant: $f"; exit 1 }
          }
          Set-Content -Path "dist\VERSION.txt" -Value $tag -Encoding UTF8
          Remove-Item "birdnet.tar.gz" -Force
      - name: Copy FFmpeg & FFprobe
        shell: pwsh
        run: |
          Copy-Item -Path (Get-Command ffmpeg).Source -Destination "dist\ffmpeg.exe" -Force
          Copy-Item -Path (Get-Command ffprobe).Source -Destination "dist\ffprobe.exe" -Force
      - name: Generate UI Version file
        shell: pwsh
        run: |
          $tag = "v${{ needs.check-version.outputs.stable_tag }}.${{ github.run_number }}-${{ github.run_attempt }}"
          Set-Content -Path "dist\UI_VERSION.txt" -Value $tag -Encoding UTF8
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Compile C# UI
        shell: pwsh
        run: |
          dotnet publish src/BirdNET-Go-Control.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=embedded `
            -o dist
      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer/BirdNET-Go-Installer.iss"
      - name: Build portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "Output" -Force | Out-Null
          Compress-Archive -Path "dist\*" -DestinationPath "Output\BirdNET-Go-Windows-Portable.zip" -Force
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stable-windows-installer
          path: |
            Output/BirdNET-Go-Windows.exe
            Output/BirdNET-Go-Windows-Portable.zip

  build-windows-nightly:
    needs: check-version
    if: needs.check-version.outputs.build_nightly == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Install Inno Setup and FFmpeg
        run: |
          choco install innosetup --no-progress -y
          choco install ffmpeg --no-progress -y
      - name: Fetch BirdNET-Go
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "nightly-${{ needs.check-version.outputs.nightly_tag }}"
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/tphakala/birdnet-go/releases/tags/$tag" -Headers @{ "User-Agent" = "PowerShell"; "Authorization" = "Bearer $env:GITHUB_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -match "windows.*amd64.*\.tar\.gz" } | Select-Object -First 1

          if ($null -eq $asset) {
            Write-Error "Aucun asset Windows amd64 (.tar.gz) trouvé pour le tag $tag sur le dépôt upstream."
            exit 1
          }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "birdnet.tar.gz"
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          tar -xzf "birdnet.tar.gz" -C "dist"
          $required = @("birdnet-go.exe", "onnxruntime.dll", "tensorflowlite_c.dll")
          foreach ($f in $required) {
            if (-not (Test-Path "dist\$f")) { Write-Error "Manquant: $f"; exit 1 }
          }
          Set-Content -Path "dist\VERSION.txt" -Value $tag -Encoding UTF8
          Remove-Item "birdnet.tar.gz" -Force
      - name: Copy FFmpeg & FFprobe
        shell: pwsh
        run: |
          Copy-Item -Path (Get-Command ffmpeg).Source -Destination "dist\ffmpeg.exe" -Force
          Copy-Item -Path (Get-Command ffprobe).Source -Destination "dist\ffprobe.exe" -Force
      - name: Generate UI Version file
        shell: pwsh
        run: |
          $tag = "nightly-v${{ needs.check-version.outputs.nightly_tag }}.${{ github.run_number }}-${{ github.run_attempt }}"
          Set-Content -Path "dist\UI_VERSION.txt" -Value $tag -Encoding UTF8
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Compile C# UI
        shell: pwsh
        run: |
          dotnet publish src/BirdNET-Go-Control.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=embedded `
            -o dist
      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer/BirdNET-Go-Installer.iss"
      - name: Build portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "Output" -Force | Out-Null
          Compress-Archive -Path "dist\*" -DestinationPath "Output\BirdNET-Go-Windows-Portable.zip" -Force
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-windows-installer
          path: |
            Output/BirdNET-Go-Windows.exe
            Output/BirdNET-Go-Windows-Portable.zip

  build-linux-mac-stable:
    needs: check-version
    if: needs.check-version.outputs.build_stable == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
          - os: ubuntu-24.04
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Download Binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check-version.outputs.stable_tag }}"
          mkdir -p dist
          ASSET_URL=$(gh release view "$TAG" --repo tphakala/birdnet-go --json assets --jq '.assets[] | select(.name | test("${{ matrix.platform }}.*\\.tar\\.gz")) | .url' | head -n 1)
          if [ -z "$ASSET_URL" ]; then
            echo "ERREUR : Asset introuvable pour $TAG et ${{ matrix.platform }}"
            exit 1
          fi
          curl -fsSL -o birdnet.tar.gz -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$ASSET_URL"
          tar -xzf birdnet.tar.gz -C dist

      - name: Download FFmpeg & FFprobe (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          wget -q https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg dist/
          cp ffmpeg-master-latest-linux64-gpl/bin/ffprobe dist/
          rm -rf ffmpeg-master-latest-linux64-gpl*

      - name: Install FFmpeg (Mac)
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg

      - name: Cache Go (nfpm)
        if: matrix.os == 'ubuntu-24.04'
        id: go-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: go-nfpm-${{ runner.os }}-v1

      - name: Install nfpm (Linux only)
        if: matrix.os == 'ubuntu-24.04' && steps.go-cache.outputs.cache-hit != 'true'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build .deb (Linux)
        if: matrix.os == 'ubuntu-24.04'
        env:
          ARCH: ${{ contains(matrix.platform, 'amd64') && 'amd64' || 'arm64' }}
        run: |
          VERSION="${{ needs.check-version.outputs.stable_tag }}"
          sed -i "s/\${ARCH}/${ARCH}/g" installer/nfpm.yaml
          sed -i "s/\${VERSION}/${VERSION}/g" installer/nfpm.yaml
          ~/go/bin/nfpm package -p deb -f installer/nfpm.yaml
          if [ "$ARCH" = "amd64" ]; then mv *.deb BirdNET-Go-Linux-x64.deb; else mv *.deb BirdNET-Go-RaspberryPi.deb; fi

      - name: Build .pkg (Mac only)
        if: matrix.os == 'macos-latest'
        run: |
          VERSION="${{ needs.check-version.outputs.stable_tag }}"
          mkdir -p payload/usr/local/bin
          cp -r dist/* payload/usr/local/bin/
          cp -L "$(which ffmpeg)" payload/usr/local/bin/
          cp -L "$(which ffprobe)" payload/usr/local/bin/
          install_name_tool -change @rpath/libtensorflowlite_c.dylib @executable_path/libtensorflowlite_c.dylib payload/usr/local/bin/birdnet-go || true
          chmod +x payload/usr/local/bin/*
          pkgbuild --root payload --identifier com.github.timeobonnin.birdnetgo --version "$VERSION" --install-location / BirdNET-Go-macOS.pkg

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stable-${{ matrix.platform }}-pkg
          path: |
            *.deb
            *.pkg

  build-linux-mac-nightly:
    needs: check-version
    if: needs.check-version.outputs.build_nightly == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
          - os: ubuntu-24.04
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Download Binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nightly-${{ needs.check-version.outputs.nightly_tag }}"
          mkdir -p dist
          ASSET_URL=$(gh release view "$TAG" --repo tphakala/birdnet-go --json assets --jq '.assets[] | select(.name | test("${{ matrix.platform }}.*\\.tar\\.gz")) | .url' | head -n 1)
          if [ -z "$ASSET_URL" ]; then
            echo "ERREUR : Asset introuvable pour $TAG et ${{ matrix.platform }}"
            exit 1
          fi
          curl -fsSL -o birdnet.tar.gz -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$ASSET_URL"
          tar -xzf birdnet.tar.gz -C dist

      - name: Download FFmpeg & FFprobe (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          wget -q https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg dist/
          cp ffmpeg-master-latest-linux64-gpl/bin/ffprobe dist/
          rm -rf ffmpeg-master-latest-linux64-gpl*

      - name: Install FFmpeg (Mac)
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg

      - name: Cache Go (nfpm)
        if: matrix.os == 'ubuntu-24.04'
        id: go-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: go-nfpm-${{ runner.os }}-v1

      - name: Install nfpm (Linux only)
        if: matrix.os == 'ubuntu-24.04' && steps.go-cache.outputs.cache-hit != 'true'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build .deb (Linux)
        if: matrix.os == 'ubuntu-24.04'
        env:
          ARCH: ${{ contains(matrix.platform, 'amd64') && 'amd64' || 'arm64' }}
        run: |
          VERSION="${{ needs.check-version.outputs.nightly_tag }}"
          sed -i "s/\${ARCH}/${ARCH}/g" installer/nfpm.yaml
          sed -i "s/\${VERSION}/${VERSION}/g" installer/nfpm.yaml
          ~/go/bin/nfpm package -p deb -f installer/nfpm.yaml
          if [ "$ARCH" = "amd64" ]; then mv *.deb BirdNET-Go-Linux-x64.deb; else mv *.deb BirdNET-Go-RaspberryPi.deb; fi

      - name: Build .pkg (Mac only)
        if: matrix.os == 'macos-latest'
        run: |
          VERSION="${{ needs.check-version.outputs.nightly_tag }}"
          mkdir -p payload/usr/local/bin
          cp -r dist/* payload/usr/local/bin/
          cp -L "$(which ffmpeg)" payload/usr/local/bin/
          cp -L "$(which ffprobe)" payload/usr/local/bin/
          install_name_tool -change @rpath/libtensorflowlite_c.dylib @executable_path/libtensorflowlite_c.dylib payload/usr/local/bin/birdnet-go || true
          chmod +x payload/usr/local/bin/*
          pkgbuild --root payload --identifier com.github.timeobonnin.birdnetgo --version "$VERSION" --install-location / BirdNET-Go-macOS.pkg

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.platform }}-pkg
          path: |
            *.deb
            *.pkg

  publish-release:
    needs:
      [
        check-version,
        build-windows-stable,
        build-windows-nightly,
        build-linux-mac-stable,
        build-linux-mac-nightly,
      ]
    if: |
      !cancelled() &&
      (needs.check-version.outputs.build_stable == 'true' || needs.check-version.outputs.build_nightly == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build inline changelog
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName -q '.[0].tagName' || true)
          LOG=""
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null 2>&1; then
            LOG=$(git log --no-merges --pretty=format:'- %s' "$PREV..HEAD" | head -n 40)
          fi
          if [ -z "$LOG" ]; then
            LOG=$(git log --no-merges --pretty=format:'- %s' -n 20 HEAD)
          fi
          if [ -z "$LOG" ]; then
            LOG="- (changelog vide)"
          fi
          {
            echo "changelog<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download Stable artifacts
        if: needs.check-version.outputs.build_stable == 'true'
        uses: actions/download-artifact@v8
        with:
          path: all-files
          pattern: stable-*
          merge-multiple: true

      - name: Verify Stable Artifacts
        if: needs.check-version.outputs.build_stable == 'true'
        id: verify_stable
        run: |
          echo "Fichiers stables telecharges :"
          ls -la all-files/ || true
          {
            if [ -d all-files ] && [ -n "$(ls -A all-files 2>/dev/null)" ]; then
              echo "has_files=true"
            else
              echo "has_files=false"
              echo "::warning::Aucun artefact stable, publication ignoree."
            fi
            if [ -f "all-files/BirdNET-Go-Windows.exe" ] && [ -f "all-files/BirdNET-Go-Linux-x64.deb" ] && [ -f "all-files/BirdNET-Go-macOS.pkg" ]; then
              echo "is_complete=true"
              echo "release_name=Stable v${{ needs.check-version.outputs.stable_tag }}.${{ github.run_number }} OK"
              echo "release_body=Publication complete : Windows, Linux x64, Raspberry Pi, macOS."
            else
              echo "is_complete=false"
              echo "release_name=Stable v${{ needs.check-version.outputs.stable_tag }}.${{ github.run_number }} INCOMPLET"
              echo "release_body=Publication incomplete. Marquee en prerelease pour proteger la derniere version stable."
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Publish Stable Release
        if: needs.check-version.outputs.build_stable == 'true' && steps.verify_stable.outputs.has_files == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.stable_tag }}.${{ github.run_number }}-${{ github.run_attempt }}
          name: ${{ steps.verify_stable.outputs.release_name }}
          body: |
            ${{ steps.verify_stable.outputs.release_body }}

            ## 📝 Changelog
            ${{ steps.changelog.outputs.changelog }}
          files: all-files/*
          make_latest: ${{ steps.verify_stable.outputs.is_complete == 'true' }}
          prerelease: ${{ steps.verify_stable.outputs.is_complete == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Download Nightly artifacts
        if: needs.check-version.outputs.build_nightly == 'true'
        uses: actions/download-artifact@v8
        with:
          path: all-files-nightly
          pattern: nightly-*
          merge-multiple: true

      - name: Verify Nightly Artifacts
        if: needs.check-version.outputs.build_nightly == 'true'
        id: verify_nightly
        run: |
          echo "Fichiers nightly telecharges :"
          ls -la all-files-nightly/ || true
          {
            if [ -d all-files-nightly ] && [ -n "$(ls -A all-files-nightly 2>/dev/null)" ]; then
              echo "has_files=true"
            else
              echo "has_files=false"
              echo "::warning::Aucun artefact nightly, publication ignoree."
            fi
            if [ -f "all-files-nightly/BirdNET-Go-Windows.exe" ]; then
              echo "release_name=Nightly v${{ needs.check-version.outputs.nightly_tag }}.${{ github.run_number }}"
            else
              echo "release_name=Nightly v${{ needs.check-version.outputs.nightly_tag }}.${{ github.run_number }} INCOMPLET"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Publish Nightly Release
        if: needs.check-version.outputs.build_nightly == 'true' && steps.verify_nightly.outputs.has_files == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly-v${{ needs.check-version.outputs.nightly_tag }}.${{ github.run_number }}-${{ github.run_attempt }}
          name: ${{ steps.verify_nightly.outputs.release_name }}
          body: |
            ## 📝 Changelog
            ${{ steps.changelog.outputs.changelog }}
          files: all-files-nightly/*
          make_latest: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

  post-release:
    name: Trigger Maintenance + Clean + HTML
    needs: publish-release
    if: always() && needs.publish-release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Lancer "Maintenance"
        run: |
          if gh workflow run "Maintenance" --repo "$GITHUB_REPOSITORY" 2>/tmp/m.err; then
            echo "Maintenance declenchee."
          else
            echo "::warning::Dispatch Maintenance refuse. Detail : $(cat /tmp/m.err)"
            exit 1
          fi

      - name: Lancer "Clean Releases + Update HTML"
        run: |
          if gh workflow run "Clean Releases + Update HTML" --repo "$GITHUB_REPOSITORY" 2>/tmp/c.err; then
            echo "Clean Releases + Update HTML declenches."
          else
            echo "::warning::Dispatch Clean Releases refuse. Detail : $(cat /tmp/c.err)"
            exit 1
          fi
