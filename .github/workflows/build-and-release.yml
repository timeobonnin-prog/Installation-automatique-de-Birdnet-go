name: Build & Release

on:
  schedule:
    - cron: "55 15 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Forcer la compilation (Stable)"
        type: boolean
        default: false
      build_nightly:
        description: "Forcer la compilation (Nightly)"
        type: boolean
        default: false
  push:
    paths:
      - 'BirdNET-Go-Tray.ps1'
      - 'BirdNET-Go-Installer.iss'
      - 'nfpm.yaml'
      - 'icon.ico'
      - 'logo.png'
      - 'start_birdnet.bat'
      - 'install-birdnet.sh'
      - 'scripts/**'
      - '.github/workflows/build-and-release.yml'

permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  # ============================================================
  # JOB 1 : VÉRIFICATION DES VERSIONS (VERSION INFAILLIBLE)
  # ============================================================
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_stable: ${{ steps.check.outputs.build_stable }}
      build_nightly: ${{ steps.check.outputs.build_nightly }}
      stable_tag: ${{ steps.check.outputs.stable }}
      nightly_tag: ${{ steps.check.outputs.nightly }}
    steps:
      - uses: actions/checkout@v4
      - name: Check versions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Vérifier la Stable
          STABLE=$(gh release list --repo tphakala/birdnet-go --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          echo "stable=$STABLE" >> $GITHUB_OUTPUT
          HAS_STABLE=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName -q ".[] | select(.tagName | startswith(\"v$STABLE\")) | .tagName" || true)
          if [ -z "$HAS_STABLE" ] || [ "${{ github.event.inputs.force_build }}" == "true" ]; then
            echo "build_stable=true" >> $GITHUB_OUTPUT
          else
            echo "build_stable=false" >> $GITHUB_OUTPUT
          fi
          
          # 2. Vérifier la Nightly (en ignorant 'manifest')
          NIGHTLY_RAW=$(gh release list --repo tphakala/birdnet-go --exclude-drafts --pre-releases --limit 50 --json tagName -q '.[].tagName' | grep -m 1 '^nightly-' || true)
          
          if [ -n "$NIGHTLY_RAW" ]; then
            CLEAN_NIGHTLY="${NIGHTLY_RAW#nightly-}"
            echo "nightly=$CLEAN_NIGHTLY" >> $GITHUB_OUTPUT
            HAS_NIGHTLY=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName -q ".[] | select(.tagName | startswith(\"nightly-v$CLEAN_NIGHTLY\")) | .tagName" || true)
            
            if [ -z "$HAS_NIGHTLY" ] || [ "${{ github.event.inputs.force_build }}" == "true" ] || [ "${{ github.event.inputs.build_nightly }}" == "true" ]; then
              echo "build_nightly=true" >> $GITHUB_OUTPUT
            else
              echo "build_nightly=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "nightly=" >> $GITHUB_OUTPUT
            echo "build_nightly=false" >> $GITHUB_OUTPUT
          fi

  # ============================================================
  # JOB 2A : COMPILATION WINDOWS STABLE
  # ============================================================
  build-windows-stable:
    needs: check-version
    if: needs.check-version.outputs.build_stable == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup and FFmpeg
        run: |
          choco install innosetup --no-progress -y
          choco install ffmpeg --no-progress -y
      - name: Fetch BirdNET-Go
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ needs.check-version.outputs.stable_tag }}"
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/tphakala/birdnet-go/releases/tags/$tag" -Headers @{ "User-Agent" = "PowerShell"; "Authorization" = "Bearer $env:GITHUB_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -match "windows.*amd64.*\.tar\.gz" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "birdnet.tar.gz"
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          tar -xzf "birdnet.tar.gz" -C "dist"
          $required = @("birdnet-go.exe", "onnxruntime.dll", "tensorflowlite_c.dll")
          foreach ($f in $required) {
            if (-not (Test-Path "dist\$f")) { Write-Error "Manquant: $f"; exit 1 }
          }
          Remove-Item "birdnet.tar.gz" -Force
      - name: Copy FFmpeg
        shell: pwsh
        run: |
          Copy-Item -Path (Get-Command ffmpeg).Source -Destination "dist\ffmpeg.exe" -Force
          Copy-Item -Path (Get-Command ffprobe).Source -Destination "dist\ffprobe.exe" -Force
      - name: Compile GUI to EXE
        shell: pwsh
        run: |
          Install-Module ps2exe -Scope CurrentUser -Force
          Invoke-ps2exe -InputFile "BirdNET-Go-Tray.ps1" -OutputFile "dist\BirdNET-Go-Control.exe" -noConsole -iconFile "icon.ico"
      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "BirdNET-Go-Installer.iss"
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stable-windows-installer
          path: Output/BirdNET-Go-Windows.exe

  # ============================================================
  # JOB 2B : COMPILATION WINDOWS NIGHTLY
  # ============================================================
  build-windows-nightly:
    needs: check-version
    if: needs.check-version.outputs.build_nightly == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup and FFmpeg
        run: |
          choco install innosetup --no-progress -y
          choco install ffmpeg --no-progress -y
      - name: Fetch BirdNET-Go
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "nightly-${{ needs.check-version.outputs.nightly_tag }}"
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/tphakala/birdnet-go/releases/tags/$tag" -Headers @{ "User-Agent" = "PowerShell"; "Authorization" = "Bearer $env:GITHUB_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -match "windows.*amd64.*\.tar\.gz" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "birdnet.tar.gz"
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          tar -xzf "birdnet.tar.gz" -C "dist"
          $required = @("birdnet-go.exe", "onnxruntime.dll", "tensorflowlite_c.dll")
          foreach ($f in $required) {
            if (-not (Test-Path "dist\$f")) { Write-Error "Manquant: $f"; exit 1 }
          }
          Remove-Item "birdnet.tar.gz" -Force
      - name: Copy FFmpeg
        shell: pwsh
        run: |
          Copy-Item -Path (Get-Command ffmpeg).Source -Destination "dist\ffmpeg.exe" -Force
          Copy-Item -Path (Get-Command ffprobe).Source -Destination "dist\ffprobe.exe" -Force
      - name: Compile GUI to EXE
        shell: pwsh
        run: |
          Install-Module ps2exe -Scope CurrentUser -Force
          Invoke-ps2exe -InputFile "BirdNET-Go-Tray.ps1" -OutputFile "dist\BirdNET-Go-Control.exe" -noConsole -iconFile "icon.ico"
      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "BirdNET-Go-Installer.iss"
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-windows-installer
          path: Output/BirdNET-Go-Windows.exe

  # ============================================================
  # JOB 3A : COMPILATION LINUX / MAC STABLE (API)
  # ============================================================
  build-linux-mac-stable:
    needs: check-version
    if: needs.check-version.outputs.build_stable == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-latest
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check-version.outputs.stable_tag }}"
          mkdir -p dist
          ASSET_URL=$(gh release view "$TAG" --repo tphakala/birdnet-go --json assets --jq '.assets[] | select(.name | test("${{ matrix.platform }}.*\\.tar\\.gz")) | .url' | head -n 1)
          if [ -z "$ASSET_URL" ]; then
            echo "ERREUR : Asset introuvable pour $TAG et ${{ matrix.platform }}"
            exit 1
          fi
          curl -fsSL -o birdnet.tar.gz -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$ASSET_URL"
          tar -xzf birdnet.tar.gz -C dist
      - name: Install nfpm (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Build .deb (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          ARCH: ${{ contains(matrix.platform, 'amd64') && 'amd64' || 'arm64' }}
        run: |
          VERSION="${{ needs.check-version.outputs.stable_tag }}"
          sed -i "s/\${ARCH}/${ARCH}/g" nfpm.yaml
          sed -i "s/\${VERSION}/${VERSION}/g" nfpm.yaml
          ~/go/bin/nfpm package -p deb -f nfpm.yaml
          if [ "$ARCH" = "amd64" ]; then mv *.deb BirdNET-Go-Linux-x64.deb; else mv *.deb BirdNET-Go-RaspberryPi.deb; fi
      - name: Build .pkg (Mac only)
        if: matrix.os == 'macos-latest'
        run: |
          VERSION="${{ needs.check-version.outputs.stable_tag }}"
          mkdir -p payload/usr/local/bin
          cp -r dist/* payload/usr/local/bin/
          chmod +x payload/usr/local/bin/birdnet-go
          pkgbuild --root payload --identifier com.github.timeobonnin.birdnetgo --version $VERSION --install-location / BirdNET-Go-macOS.pkg
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stable-${{ matrix.platform }}-pkg
          path: |
            *.deb
            *.pkg

  # ============================================================
  # JOB 3B : COMPILATION LINUX / MAC NIGHTLY (API)
  # ============================================================
  build-linux-mac-nightly:
    needs: check-version
    if: needs.check-version.outputs.build_nightly == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-latest
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nightly-${{ needs.check-version.outputs.nightly_tag }}"
          mkdir -p dist
          ASSET_URL=$(gh release view "$TAG" --repo tphakala/birdnet-go --json assets --jq '.assets[] | select(.name | test("${{ matrix.platform }}.*\\.tar\\.gz")) | .url' | head -n 1)
          if [ -z "$ASSET_URL" ]; then
            echo "ERREUR : Asset introuvable pour $TAG et ${{ matrix.platform }}"
            exit 1
          fi
          curl -fsSL -o birdnet.tar.gz -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$ASSET_URL"
          tar -xzf birdnet.tar.gz -C dist
      - name: Install nfpm (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Build .deb (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          ARCH: ${{ contains(matrix.platform, 'amd64') && 'amd64' || 'arm64' }}
        run: |
          VERSION="${{ needs.check-version.outputs.nightly_tag }}"
          sed -i "s/\${ARCH}/${ARCH}/g" nfpm.yaml
          sed -i "s/\${VERSION}/${VERSION}/g" nfpm.yaml
          ~/go/bin/nfpm package -p deb -f nfpm.yaml
          if [ "$ARCH" = "amd64" ]; then mv *.deb BirdNET-Go-Linux-x64.deb; else mv *.deb BirdNET-Go-RaspberryPi.deb; fi
      - name: Build .pkg (Mac only)
        if: matrix.os == 'macos-latest'
        run: |
          VERSION="${{ needs.check-version.outputs.nightly_tag }}"
          mkdir -p payload/usr/local/bin
          cp -r dist/* payload/usr/local/bin/
          chmod +x payload/usr/local/bin/birdnet-go
          pkgbuild --root payload --identifier com.github.timeobonnin.birdnetgo --version $VERSION --install-location / BirdNET-Go-macOS.pkg
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.platform }}-pkg
          path: |
            *.deb
            *.pkg

  # ============================================================
  # JOB 4 : PUBLICATION DES RELEASES
  # ============================================================
  publish-release:
    needs: [check-version, build-windows-stable, build-windows-nightly, build-linux-mac-stable, build-linux-mac-nightly]
    if: |
      (needs.check-version.outputs.build_stable == 'true' || needs.check-version.outputs.build_nightly == 'true') &&
      always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Stable artifacts
        if: needs.check-version.outputs.build_stable == 'true'
        uses: actions/download-artifact@v4
        with:
          path: all-files
          pattern: stable-*
          merge-multiple: true
      - name: Publish Stable Release
        if: needs.check-version.outputs.build_stable == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.stable_tag }}.${{ github.run_number }}
          name: "Version Stable v${{ needs.check-version.outputs.stable_tag }}.${{ github.run_number }}"
          files: all-files/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Nightly artifacts
        if: needs.check-version.outputs.build_nightly == 'true'
        uses: actions/download-artifact@v4
        with:
          path: all-files-nightly
          pattern: nightly-*
          merge-multiple: true
      - name: Publish Nightly Release
        if: needs.check-version.outputs.build_nightly == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-v${{ needs.check-version.outputs.nightly_tag }}.${{ github.run_number }}
          name: "Version Nightly nightly-v${{ needs.check-version.outputs.nightly_tag }}.${{ github.run_number }}"
          files: all-files-nightly/*
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
