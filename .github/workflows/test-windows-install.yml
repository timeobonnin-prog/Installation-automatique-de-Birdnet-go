name: Test Windows Installer

on:
  push:
    branches: [ main ]
    paths:
      - 'install-birdnet.ps1'
      - '.github/workflows/test-windows-install.yml'
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run PowerShell Installer
        shell: pwsh
        run: |
          # Création du dossier de test automatique
          $testDir = "${{ github.workspace }}\test-appdata"
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          
          # On force le script à utiliser ce dossier
          $env:LOCALAPPDATA = $testDir
          .\install-birdnet.ps1
          
      - name: Verify Installation
        shell: pwsh
        run: |
          $installDir = "${{ github.workspace }}\test-appdata\BirdNET-Go"
          if (-not (Test-Path "$installDir\birdnet-go.exe")) {
            Write-Error "❌ birdnet-go.exe non trouvé dans $installDir"
            exit 1
          }
          Write-Host "✅ Installation Windows réussie : le binaire est bien présent."
