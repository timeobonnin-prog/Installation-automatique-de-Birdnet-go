name: Auto-Merge (Dependabot & Moi)

on:
  workflow_run:
    workflows: ["Quality, Security & Notifications"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le numéro de la PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }} --jq '.pull_requests[0].number')
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then exit 0; fi
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Vérifier l'auteur et fusionner
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          AUTHOR=$(gh pr view $PR_NUMBER --json author --jq .author.login)
          if [ "$AUTHOR" == "dependabot[bot]" ] || [ "$AUTHOR" == "${{ github.repository_owner }}" ]; then
            gh pr review $PR_NUMBER --approve
            gh pr merge $PR_NUMBER --squash --delete-branch
          fi
