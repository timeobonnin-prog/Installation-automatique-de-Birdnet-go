name: Auto-merge PR (Dependabot + Owner)

on:
  check_suite:
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mode simulation (ne merge rien)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Ajout de 'app/dependabot' pour couvrir les variations de nom du bot GitHub
      ALLOWED_AUTHORS: "dependabot[bot],app/dependabot,timeobonnin-prog"
      GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
    steps:
      - name: Vérifier le token
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "❌ Aucun token disponible (ni GH_PAT ni GITHUB_TOKEN)."
            exit 1
          fi
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "⚠️ Pas de GH_PAT : les PR Dependabot ne pourront PAS être mergées automatiquement."
          fi

      - name: Scanner et merger les PR éligibles
        run: |
          REPO="$GITHUB_REPOSITORY"
          IFS=',' read -ra AUTHORS <<< "$ALLOWED_AUTHORS"

          echo "🔍 Recherche des PR ouvertes..."
          PRS=$(gh pr list --repo "$REPO" --state open \
            --json number,title,author,headRefOid,mergeable,mergeStateStatus \
            --limit 100)

          echo "$PRS" | jq -c '.[]' | while read -r pr; do
            NUM=$(echo "$pr" | jq -r '.number')
            TITLE=$(echo "$pr" | jq -r '.title')
            AUTHOR=$(echo "$pr" | jq -r '.author.login')
            MERGEABLE=$(echo "$pr" | jq -r '.mergeable')
            STATE=$(echo "$pr" | jq -r '.mergeStateStatus')
            SHA=$(echo "$pr" | jq -r '.headRefOid')

            echo "────────────────────────────────────────"
            echo "PR #$NUM — $TITLE (auteur: $AUTHOR, state: $STATE)"

            # 1) Filtre auteur (correspondance partielle pour attraper 'app/dependabot' ou 'dependabot[bot]')
            ALLOWED=false
            for a in "${AUTHORS[@]}"; do
              if [[ "$AUTHOR" == *"$a"* ]]; then 
                ALLOWED=true
                break
              fi
            done
            if [ "$ALLOWED" = false ]; then
              echo "⏭️  Auteur non autorisé, skip."
              continue
            fi

            # 2) Filtre état de merge (On accepte CLEAN et UNSTABLE, on bloque DIRTY et BLOCKED)
            if [ "$STATE" = "DIRTY" ]; then
              echo "⚠️  Conflit détecté, skip. Rebase nécessaire."
              continue
            fi
            if [ "$STATE" = "BLOCKED" ]; then
              echo "⚠️  Required checks non passés, skip."
              continue
            fi
            if [ "$MERGEABLE" != "MERGEABLE" ]; then
              echo "⚠️  mergeable=$MERGEABLE, skip."
              continue
            fi

            # 3) Vérifier les check-runs du commit head
            CHECKS=$(gh api "repos/$REPO/commits/$SHA/check-runs" -q '.check_runs[] | "\(.status) \(.conclusion)"' 2>/dev/null || true)
            PENDING=$(echo "$CHECKS" | grep -cE "in_progress|queued" || true)
            FAILED=$(echo "$CHECKS" | grep -cE "completed (failure|cancelled|timed_out|action_required)" || true)
            SUCCESS=$(echo "$CHECKS" | grep -c "completed success" || true)

            if [ "$PENDING" -gt 0 ]; then
              echo "⏳ $PENDING check(s) en cours, skip (réessai au prochain run)."
              continue
            fi
            if [ "$FAILED" -gt 0 ]; then
              echo "❌ $FAILED check(s) en échec, skip."
              continue
            fi
            if [ "$SUCCESS" -eq 0 ]; then
              echo "ℹ️  Aucun check success, skip."
              continue
            fi
            echo "✅ Tous les checks sont verts ($SUCCESS success)."

            # 4) MERGE
            if [ "$DRY_RUN" = "true" ]; then
              echo "🧪 DRY-RUN : aurait mergé PR #$NUM"
            else
              echo "🚀 Merge squash de PR #$NUM..."
              if gh pr merge "$NUM" --repo "$REPO" --squash --delete-branch \
                 --body "Auto-merged: tous les checks au vert, auteur autorisé."; then
                echo "✅ PR #$NUM mergée !"
              else
                echo "❌ Échec du merge (GH_PAT requis pour Dependabot)."
              fi
            fi
          done

      - name: Résumé
        if: always()
        run: |
          echo "## 🤖 Auto-merge" >> $GITHUB_STEP_SUMMARY
          echo "- Auteurs autorisés : \`$ALLOWED_AUTHORS\`" >> $GITHUB_STEP_SUMMARY
          echo "- Mode : $( [ "$DRY_RUN" = true ] && echo '🧪 DRY-RUN' || echo '🚀 Actif' )" >> $GITHUB_STEP_SUMMARY
