name: Auto-Merge (Dependabot & Moi)

on:
  # On se déclenche UNIQUEMENT quand le workflow de test est terminé
  workflow_run:
    workflows: ["Quality, Security & Notifications"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # On ne se lance que si les tests ont réussi ET que c'est pour une Pull Request
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le numéro de la PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On récupère le numéro de la PR associée à ce run
          PR_NUMBER=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }} --jq '.pull_requests[0].number')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
            echo "Aucune PR associée à ce run."
            exit 0
          fi
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "✅ PR trouvée : #$PR_NUMBER"

      - name: Vérifier l'auteur et fusionner
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # On récupère l'auteur de la PR
          AUTHOR=$(gh pr view $PR_NUMBER --json author --jq .author.login)
          echo "Auteur de la PR : $AUTHOR"

          # On vérifie si c'est Dependabot ou toi (le propriétaire du dépôt)
          if [ "$AUTHOR" == "dependabot[bot]" ] || [ "$AUTHOR" == "${{ github.repository_owner }}" ]; then
            echo "C'est une PR autorisée. Approbation et fusion..."
            gh pr review $PR_NUMBER --approve
            gh pr merge $PR_NUMBER --squash --delete-branch
            echo "✅ PR #$PR_NUMBER fusionnée avec succès."
          else
            echo "⚠️ L'auteur ($AUTHOR) n'est pas autorisé à l'auto-merge."
          fi
