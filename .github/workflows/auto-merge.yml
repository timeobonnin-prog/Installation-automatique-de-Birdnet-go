name: Auto-merge PR (Dependabot + Owner)

# Se déclenche automatiquement à la fin des tests d'une PR
on:
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Liste des auteurs autorisés à l'auto-merge
      ALLOWED_AUTHORS: "dependabot[bot],app/dependabot,timeobonnin-prog"
      # Le token (le PAT est nécessaire pour merger les PR de Dependabot)
      GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - name: Vérifier le token
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "❌ Aucun token disponible. L'auto-merge est désactivé."
            exit 1
          fi

      - name: Scanner et merger les PR éligibles
        run: |
          REPO="$GITHUB_REPOSITORY"
          IFS=',' read -ra AUTHORS <<< "$ALLOWED_AUTHORS"

          echo "🔍 Recherche des PR ouvertes..."
          PRS=$(gh pr list --repo "$REPO" --state open \
            --json number,title,author,headRefOid,mergeable,mergeStateStatus \
            --limit 100)

          echo "$PRS" | jq -c '.[]' | while read -r pr; do
            NUM=$(echo "$pr" | jq -r '.number')
            TITLE=$(echo "$pr" | jq -r '.title')
            AUTHOR=$(echo "$pr" | jq -r '.author.login')
            MERGEABLE=$(echo "$pr" | jq -r '.mergeable')
            STATE=$(echo "$pr" | jq -r '.mergeStateStatus')
            SHA=$(echo "$pr" | jq -r '.headRefOid')

            echo "────────────────────────────────────────"
            echo "PR #$NUM — $TITLE (auteur: $AUTHOR, state: $STATE)"

            # 1) Vérifier l'auteur
            ALLOWED=false
            for a in "${AUTHORS[@]}"; do
              if [[ "$AUTHOR" == *"$a"* ]]; then 
                ALLOWED=true
                break
              fi
            done
            if [ "$ALLOWED" = false ]; then
              echo "⏭️  Auteur non autorisé, skip."
              continue
            fi

            # 2) Vérifier l'absence de conflits
            if [ "$STATE" = "DIRTY" ] || [ "$STATE" = "BLOCKED" ]; then
              echo "⚠️  Conflit ou checks requis non passés, skip."
              continue
            fi
            if [ "$MERGEABLE" != "MERGEABLE" ]; then
              echo "⚠️  mergeable=$MERGEABLE, skip."
              continue
            fi

            # 3) Vérifier que TOUS les checks sont verts (succès)
            CHECKS=$(gh api "repos/$REPO/commits/$SHA/check-runs" -q '.check_runs[] | "\(.status) \(.conclusion)"' 2>/dev/null || true)
            PENDING=$(echo "$CHECKS" | grep -cE "in_progress|queued" || true)
            FAILED=$(echo "$CHECKS" | grep -cE "completed (failure|cancelled|timed_out|action_required)" || true)
            SUCCESS=$(echo "$CHECKS" | grep -c "completed success" || true)

            if [ "$PENDING" -gt 0 ]; then
              echo "⏳ Checks encore en cours, on attend le prochain déclenchement."
              continue
            fi
            if [ "$FAILED" -gt 0 ]; then
              echo "❌ Des checks ont échoué, skip."
              continue
            fi
            if [ "$SUCCESS" -eq 0 ]; then
              echo "ℹ️  Aucun check terminé, skip."
              continue
            fi
            
            echo "✅ Tous les checks sont verts ($SUCCESS success). Merge en cours..."

            # 4) MERGE automatique (Squash)
            if gh pr merge "$NUM" --repo "$REPO" --squash --delete-branch \
               --body "🤖 Auto-merged: tous les checks sont au vert et l'auteur est autorisé."; then
              echo "✅ PR #$NUM mergée avec succès !"
            else
              echo "❌ Échec du merge. (Vérifie que le secret GH_PAT est bien configuré pour les PR Dependabot)"
            fi
          done
