name: Build, Scan and Release Windows Installer

on:
  push:
    tags:
      - 'v-*'
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-scan-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "BirdNET-Go-Installer.iss"

      - name: Scan with VirusTotal
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if (-not $env:VT_API_KEY) {
            Write-Error "Secret VT_API_KEY manquant."
            exit 1
          }
          $file = 'Output\BirdNET-Go-Installer.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
          $headers = @{ 'x-apikey' = $env:VT_API_KEY }
          $lookup = "https://www.virustotal.com/api/v3/files/$hash"

          try {
            Invoke-RestMethod -Uri $lookup -Headers $headers | Out-Null
          } catch {
            Write-Host "Fichier inconnu, upload..."
            $upload = Invoke-RestMethod -Method Post `
              -Uri 'https://www.virustotal.com/api/v3/files' `
              -Headers $headers `
              -Form @{ file = Get-Item $file }
            $analysisId = $upload.data.id
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 10
              $a = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/analyses/$analysisId" -Headers $headers
              if ($a.data.attributes.status -eq 'completed') { break }
            }
          }

          Start-Sleep -Seconds 10
          $resp = Invoke-RestMethod -Uri $lookup -Headers $headers
          $stats = $resp.data.attributes.last_analysis_stats
          Write-Host "Détections : malicious=$($stats.malicious) suspicious=$($stats.suspicious)"
          if ($stats.malicious -gt 2) {
            Write-Error "Trop de détections ($($stats.malicious)). Publication annulée."
            exit 1
          }

      - name: Compute SHA-256
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash -Algorithm SHA256 'Output\BirdNET-Go-Installer.exe').Hash.ToLower()
          echo "sha256=$h" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/BirdNET-Go-Installer.exe
          generate_release_notes: true
          body: |
            ## Installateur Windows BirdNET-Go

            ⚠️ **Fichier non signé numériquement.**
            Windows SmartScreen peut afficher un avertissement au premier lancement.
            Cliquez sur **"Informations complémentaires"** → **"Exécuter quand même"**.

            **SHA-256** : `${{ steps.hash.outputs.sha256 }}`

            Version cible : `${{ github.ref_name }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
