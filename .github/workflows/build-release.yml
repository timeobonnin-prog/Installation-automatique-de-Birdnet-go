name: Build, Scan and Release Windows Installer

on:
  push:
    branches: [ main ]
    paths:
      - 'install-birdnet.ps1'
      - 'BirdNET-Go-Installer.iss'
      - '.github/workflows/build-release.yml'
  create:
    tags:
      - 'v-*'
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-scan-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Fetch Upstream Release Info
        id: upstream
        shell: pwsh
        run: |
          $apiUrl = "https://api.github.com/repos/tphakala/birdnet-go/releases/latest"
          $headers = @{ "User-Agent" = "PowerShell" }
          $release = Invoke-RestMethod -Uri $apiUrl -Headers $headers
          echo "tag=$($release.tag_name)" >> $env:GITHUB_OUTPUT
          echo "url=$($release.html_url)" >> $env:GITHUB_OUTPUT
          
          $asset = $release.assets | Where-Object { $_.name -match "windows.*amd64.*\.tar\.gz" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "birdnet.tar.gz"
          
          mkdir dist -Force | Out-Null
          tar -xzf birdnet.tar.gz -C dist
          
          $exe = Get-ChildItem -Path dist -Filter "birdnet-go.exe" -Recurse | Select-Object -First 1
          Move-Item -Path $exe.FullName -Destination "dist\birdnet-go.exe" -Force
          
          Set-Content -Path "dist\VERSION.txt" -Value $release.tag_name -Encoding UTF8
          
          Remove-Item birdnet.tar.gz

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "BirdNET-Go-Installer.iss"

      - name: Scan with VirusTotal
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          try {
            if (-not $env:VT_API_KEY) {
              Write-Warning "Secret VT_API_KEY manquant."
              exit 0
            }
            
            $file = Get-Item 'Output\BirdNET-Go-Installer.exe'
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower()
            $headers = @{ 'x-apikey' = $env:VT_API_KEY }
            $lookup = "https://www.virustotal.com/api/v3/files/$hash"
            
            $response = Invoke-WebRequest -Uri $lookup -Headers $headers -Method Get -UseBasicParsing -SkipHttpErrorCheck

            if ($response.StatusCode -eq 200) {
              Write-Host "Fichier déjà connu de VirusTotal."
            } elseif ($response.StatusCode -eq 404) {
              Write-Host "Fichier inconnu, demande d'une URL d'upload spéciale..."
              
              $uploadUrlReq = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" -Headers $headers -Method Get
              $targetUrl = $uploadUrlReq.data
              
              Write-Host "Upload en cours..."
              $curlOutput = & curl.exe -s -X POST $targetUrl -H "x-apikey: $($env:VT_API_KEY)" -F "file=@$($file.FullName)"
              
              $uploadData = $curlOutput | ConvertFrom-Json
              $analysisId = $uploadData.data.id
              Write-Host "Upload réussi. Analyse en cours..."

              for ($i=0; $i -lt 30; $i++) {
                Start-Sleep -Seconds 10
                $analysis = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/analyses/$analysisId" -Headers $headers
                if ($analysis.data.attributes.status -eq 'completed') {
                  Write-Host "Analyse terminée."
                  break
                }
              }
            } else {
              Write-Warning "Erreur API ($($response.StatusCode)). On ignore."
              exit 0
            }

            Start-Sleep -Seconds 5
            $finalReport = Invoke-RestMethod -Uri $lookup -Headers $headers
            $stats = $finalReport.data.attributes.last_analysis_stats
            Write-Host "Détections : malicious=$($stats.malicious) suspicious=$($stats.suspicious)"

            if ($stats.malicious -gt 15) {
              Write-Error "Trop de détections."
              exit 1
            }
          } catch {
            Write-Warning "Erreur lors du scan : $_"
            exit 0
          }

      - name: Compute SHA-256
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash -Algorithm SHA256 'Output\BirdNET-Go-Installer.exe').Hash.ToLower()
          echo "sha256=$h" >> $env:GITHUB_OUTPUT

      - name: Calculate Next Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            echo "tag_name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            $birdnetTag = "${{ steps.upstream.outputs.tag }}"
            $file = "INSTALLER_VERSION.txt"
            $newVersion = "$birdnetTag.1"

            if (Test-Path $file) {
              $oldVersion = (Get-Content $file -Raw).Trim()
              $lastDotIndex = $oldVersion.LastIndexOf('.')
              if ($lastDotIndex -gt 0) {
                $prefix = $oldVersion.Substring(0, $lastDotIndex)
                $buildNum = [int]$oldVersion.Substring($lastDotIndex + 1)
                if ($prefix -eq $birdnetTag) {
                  $buildNum++
                  $newVersion = "$birdnetTag.$buildNum"
                }
              }
            }
            echo "tag_name=v$newVersion" >> $env:GITHUB_OUTPUT
            Set-Content -Path $file -Value $newVersion
          }

      - name: Commit Version Bump
        if: ${{ github.ref_type != 'tag' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add INSTALLER_VERSION.txt
          git commit -m "chore: bump installer version to ${{ steps.version.outputs.tag_name }} [skip ci]" || true
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "Installateur Windows ${{ steps.version.outputs.tag_name }}"
          files: Output/BirdNET-Go-Installer.exe
          generate_release_notes: false
          body: |
            ### 🪶 BirdNET-Go pour Windows (x64 / ARM64)

            Cet installateur inclut directement la dernière version de BirdNET-Go.

            | Détails | Valeur |
            | :--- | :--- |
            | **Version de l'installateur** | `${{ steps.version.outputs.tag_name }}` |
            | **Version cible de BirdNET-Go** | [`${{ steps.upstream.outputs.tag }}`](${{ steps.upstream.outputs.url }}) |

            ---

            ### 🛡️ Sécurité & Intégrité

            > ⚠️ **Fichier non signé numériquement.** Windows SmartScreen peut afficher un avertissement au premier lancement. Cliquez sur *"Informations complémentaires"* puis *"Exécuter quand même"*.

            **🔍 Analyse VirusTotal :**
            👉 [Cliquez ici pour voir le rapport d'analyse complet](https://www.virustotal.com/gui/file/${{ steps.hash.outputs.sha256 }})

            **#️⃣ Empreinte SHA-256 :** ${{ steps.hash.outputs.sha256 }}

            ---

            ### 🔏 Code signing policy
            Free code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/).
            - **Committers and reviewers:** [timeobonnin-prog](https://github.com/timeobonnin-prog)
            - **Approvers:** [timeobonnin-prog](https://github.com/timeobonnin-prog)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
