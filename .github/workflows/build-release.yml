name: Build and Release All Platforms

on:
  push:
    branches: [ main ]
    paths:
      - 'BirdNET-Go-Installer.iss'
      - 'nfpm.yaml'
      - '.github/workflows/build-release.yml'
  create:
    tags:
      - 'v-*'
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1 : WINDOWS (.exe)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      upstream_tag: ${{ steps.upstream.outputs.tag }}
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Fetch Upstream Release Info
        id: upstream
        shell: pwsh
        run: |
          $apiUrl = "https://api.github.com/repos/tphakala/birdnet-go/releases/latest"
          $headers = @{ "User-Agent" = "PowerShell" }
          $release = Invoke-RestMethod -Uri $apiUrl -Headers $headers
          echo "tag=$($release.tag_name)" >> $env:GITHUB_OUTPUT
          echo "url=$($release.html_url)" >> $env:GITHUB_OUTPUT
          
          $asset = $release.assets | Where-Object { $_.name -match "windows.*amd64.*\.tar\.gz" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "birdnet.tar.gz"
          
          mkdir dist -Force | Out-Null
          tar -xzf birdnet.tar.gz -C dist
          
          $exe = Get-ChildItem -Path dist -Filter "birdnet-go.exe" -Recurse | Select-Object -First 1
          Move-Item -Path $exe.FullName -Destination "dist\birdnet-go.exe" -Force
          
          Set-Content -Path "dist\VERSION.txt" -Value $release.tag_name -Encoding UTF8
          Remove-Item birdnet.tar.gz

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "BirdNET-Go-Installer.iss"

      - name: Compute SHA-256
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash -Algorithm SHA256 'Output\BirdNET-Go-Installer.exe').Hash.ToLower()
          echo "sha256=$h" >> $env:GITHUB_OUTPUT

      - name: Calculate Unique Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            echo "tag_name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            $birdnetTag = "${{ steps.upstream.outputs.tag }}"
            $runNumber = "${{ github.run_number }}"
            echo "tag_name=v$birdnetTag.$runNumber" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release (Draft)
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "Installateur Multi-Plateformes ${{ steps.version.outputs.tag_name }}"
          draft: true
          generate_release_notes: false
          body: |
            ### 🪶 BirdNET-Go (Windows, Linux, Mac)

            Cette release contient les installateurs natifs pour toutes les plateformes.

            | Détails | Valeur |
            | :--- | :--- |
            | **Version de l'installateur** | ${{ steps.version.outputs.tag_name }} |
            | **Version cible de BirdNET-Go** | [${{ steps.upstream.outputs.tag }}](${{ steps.upstream.outputs.url }}) |

            ---

            ### 🛡️ Sécurité & Intégrité

            **🔍 Analyse VirusTotal (Windows) :**
            👉 [Cliquez ici pour voir le rapport complet](https://www.virustotal.com/gui/file/${{ steps.hash.outputs.sha256 }})

            **#️⃣ Empreinte SHA-256 (Windows) :**
            ${{ steps.hash.outputs.sha256 }}

            ---

            ### 🔏 Code signing policy
            Free code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/).
            - **Committers and reviewers:** [timeobonnin-prog](https://github.com/timeobonnin-prog)
            - **Approvers:** [timeobonnin-prog](https://github.com/timeobonnin-prog)
          files: Output/BirdNET-Go-Installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # JOB 2 : LINUX & RASPBERRY PI (.deb)
  # ==========================================
  build-linux:
    needs: build-windows
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Download BirdNET-Go Binary
        run: |
          mkdir -p dist
          URL="https://github.com/tphakala/birdnet-go/releases/download/${{ needs.build-windows.outputs.upstream_tag }}/birdnet-go-linux-${{ matrix.arch }}-${{ needs.build-windows.outputs.upstream_tag }}.tar.gz"
          curl -fsSL -o birdnet.tar.gz "$URL"
          tar -xzf birdnet.tar.gz -C dist
          find dist -name "birdnet-go" -type f -exec mv {} dist/ \;
          chmod +x dist/birdnet-go

      - name: Install NFPM
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt update
          sudo apt install nfpm -y

      - name: Build .deb package
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.build-windows.outputs.upstream_tag }}
        run: |
          sed -i "s/\${ARCH}/${ARCH}/g" nfpm.yaml
          sed -i "s/\${VERSION}/${VERSION}/g" nfpm.yaml
          nfpm package -p deb -f nfpm.yaml

      - name: Upload .deb to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag_name }}
          files: "*.deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # JOB 3 : MACOS (.pkg)
  # ==========================================
  build-macos:
    needs: build-windows
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Download BirdNET-Go Binary
        run: |
          mkdir -p payload/usr/local/bin
          URL="https://github.com/tphakala/birdnet-go/releases/download/${{ needs.build-windows.outputs.upstream_tag }}/birdnet-go-darwin-${{ matrix.arch }}-${{ needs.build-windows.outputs.upstream_tag }}.tar.gz"
          curl -fsSL -o birdnet.tar.gz "$URL"
          tar -xzf birdnet.tar.gz -C payload/usr/local/bin
          find payload/usr/local/bin -name "birdnet-go" -type f -exec mv {} payload/usr/local/bin/ \;
          chmod +x payload/usr/local/bin/birdnet-go

      - name: Build .pkg
        run: |
          pkgbuild --root payload \
                   --identifier com.github.timeobonnin.birdnetgo \
                   --version ${{ needs.build-windows.outputs.upstream_tag }} \
                   --install-location / \
                   "BirdNET-Go-macOS-${{ matrix.arch }}.pkg"

      - name: Upload .pkg to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag_name }}
          files: "*.pkg"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # JOB 4 : PUBLIER LA RELEASE (Une fois tout fini)
  # ==========================================
  publish-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag_name }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
