name: Build and Release All Platforms

on:
  push:
    branches: [main]
    paths:
      - "BirdNET-Go-Installer.iss"
      - "nfpm.yaml"
      - "start_birdnet.bat"
      - ".github/workflows/build-release.yml"
  create:
    tags:
      - "v-*"
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      upstream_tag: ${{ steps.upstream.outputs.tag }}
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup and FFmpeg
        run: |
          choco install innosetup --no-progress -y
          choco install ffmpeg --no-progress -y

      - name: Fetch BirdNET-Go
        id: upstream
        shell: pwsh
        run: |
          $apiUrl = "https://api.github.com/repos/tphakala/birdnet-go/releases/latest"
          $headers = @{ "User-Agent" = "PowerShell" }
          $release = Invoke-RestMethod -Uri $apiUrl -Headers $headers
          echo "tag=$($release.tag_name)" >> $env:GITHUB_OUTPUT
          echo "url=$($release.html_url)" >> $env:GITHUB_OUTPUT

          $asset = $release.assets | Where-Object { $_.name -match "windows.*amd64.*\.tar\.gz" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "birdnet.tar.gz"

          mkdir dist -Force | Out-Null
          tar -xzf birdnet.tar.gz -C dist

          $exe = Get-ChildItem -Path dist -Filter "birdnet-go.exe" -Recurse | Select-Object -First 1
          Move-Item -Path $exe.FullName -Destination "dist\birdnet-go.exe" -Force

          Set-Content -Path "dist\VERSION.txt" -Value $release.tag_name -Encoding UTF8
          Remove-Item birdnet.tar.gz

      - name: Copy FFmpeg and FFprobe to dist
        shell: pwsh
        run: |
          $ffmpegPath = (Get-Command ffmpeg).Source
          $ffprobePath = (Get-Command ffprobe).Source
          Copy-Item -Path $ffmpegPath -Destination "dist\ffmpeg.exe" -Force
          Copy-Item -Path $ffprobePath -Destination "dist\ffprobe.exe" -Force

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "BirdNET-Go-Installer.iss"

      - name: Compute SHA-256
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash -Algorithm SHA256 'Output\BirdNET-Go-Windows.exe').Hash.ToLower()
          echo "sha256=$h" >> $env:GITHUB_OUTPUT

      - name: Cache VirusTotal Result
        id: cache-vt
        uses: actions/cache@v4
        with:
          path: vt-cache
          key: vt-${{ steps.hash.outputs.sha256 }}

      - name: Scan with VirusTotal (Windows)
        if: steps.cache-vt.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          try {
            if (-not $env:VT_API_KEY) { exit 0 }
            
            $file = Get-Item 'Output\BirdNET-Go-Windows.exe'
            $hash = "${{ steps.hash.outputs.sha256 }}"
            $headers = @{ 'x-apikey' = $env:VT_API_KEY }
            $lookup = "https://www.virustotal.com/api/v3/files/$hash"
            
            $response = Invoke-WebRequest -Uri $lookup -Headers $headers -Method Get -UseBasicParsing -SkipHttpErrorCheck

            if ($response.StatusCode -eq 200) {
              Write-Host "Fichier déjà connu de VirusTotal."
            } elseif ($response.StatusCode -eq 404) {
              Write-Host "Fichier inconnu, demande d'upload speciale..."
              $uploadUrlReq = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" -Headers $headers -Method Get
              $targetUrl = $uploadUrlReq.data
              
              Write-Host "Upload en cours..."
              $curlOutput = & curl.exe -s -X POST $targetUrl -H "x-apikey: $($env:VT_API_KEY)" -F "file=@$($file.FullName)"
              
              $uploadData = $curlOutput | ConvertFrom-Json
              if ($uploadData.error) { throw "Erreur API: $($uploadData.error.message)" }
              
              $analysisId = $uploadData.data.id
              
              for ($i=0; $i -lt 30; $i++) {
                Start-Sleep -Seconds 10
                $analysis = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/analyses/$analysisId" -Headers $headers
                if ($analysis.data.attributes.status -eq 'completed') { break }
              }
            }
            
            New-Item -ItemType Directory -Path vt-cache -Force | Out-Null
            $stats = (Invoke-RestMethod -Uri $lookup -Headers $headers).data.attributes.last_analysis_stats
            $stats | ConvertTo-Json | Set-Content "vt-cache\$hash.json"
          } catch {
            Write-Warning "Quota ou erreur VirusTotal. On continue sans scan."
          }

      - name: Calculate Unique Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            echo "tag_name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag_name=v${{ steps.upstream.outputs.tag }}.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release (Draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "Version ${{ steps.version.outputs.tag_name }}"
          draft: true
          generate_release_notes: false
          body: |
            <p align="center">
              <img src="https://raw.githubusercontent.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/main/logo.png" width="150" alt="Logo">
            </p>

            ### 🪶 BirdNET-Go Multi-Plateformes

            | Plateforme | Lien direct de téléchargement |
            | :--- | :--- |
            | 🪟 **Windows** | [Télécharger l'installateur (.exe)](https://github.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/releases/latest/download/BirdNET-Go-Windows.exe) |
            | 🐧 **Linux (PC)** | [Télécharger le paquet (.deb)](https://github.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/releases/latest/download/BirdNET-Go-Linux-x64.deb) |
            | 🍓 **Raspberry Pi** | [Télécharger le paquet (.deb)](https://github.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/releases/latest/download/BirdNET-Go-RaspberryPi.deb) |
            | 🍎 **macOS** | [Télécharger le paquet (.pkg)](https://github.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/releases/latest/download/BirdNET-Go-macOS.pkg) |

            ---

            **🔍 Analyse VirusTotal (Windows) :**
            👉 [Cliquez ici pour voir le rapport complet](https://www.virustotal.com/gui/file/${{ steps.hash.outputs.sha256 }})

            **#️⃣ Empreinte SHA-256 (Windows) :** ${{ steps.hash.outputs.sha256 }}
          files: Output/BirdNET-Go-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: build-windows
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Download Binary
        run: |
          mkdir -p dist
          URL="https://github.com/tphakala/birdnet-go/releases/download/${{ needs.build-windows.outputs.upstream_tag }}/birdnet-go-linux-${{ matrix.arch }}-${{ needs.build-windows.outputs.upstream_tag }}.tar.gz"
          curl -fsSL -o birdnet.tar.gz "$URL"
          tar -xzf birdnet.tar.gz -C dist
          find dist -name "birdnet-go" -type f -exec mv {} dist/ \;
          chmod +x dist/birdnet-go

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build .deb
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.build-windows.outputs.upstream_tag }}
        run: |
          sed -i "s/\${ARCH}/${ARCH}/g" nfpm.yaml
          sed -i "s/\${VERSION}/${VERSION}/g" nfpm.yaml
          ~/go/bin/nfpm package -p deb -f nfpm.yaml

      - name: Rename .deb
        run: |
          if [ "${{ matrix.arch }}" = "amd64" ]; then mv *.deb BirdNET-Go-Linux-x64.deb; else mv *.deb BirdNET-Go-RaspberryPi.deb; fi

      - name: Scan with VirusTotal (Linux/Mac)
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then exit 0; fi

          FILE_NAME=$(ls *.deb)
          HASH=$(sha256sum "$FILE_NAME" | cut -d ' ' -f 1)
          LOOKUP="https://www.virustotal.com/api/v3/files/$HASH"

          # On vérifie si le fichier est connu
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "x-apikey: $VT_API_KEY" "$LOOKUP")

          if [ "$HTTP_STATUS" -eq 404 ]; then
            echo "Fichier inconnu, upload en cours..."
            UPLOAD_URL=$(curl -s -H "x-apikey: $VT_API_KEY" "https://www.virustotal.com/api/v3/files/upload_url" | jq -r .data)
            curl -s -X POST "$UPLOAD_URL" -H "x-apikey: $VT_API_KEY" -F "file=@$FILE_NAME" > /dev/null
            sleep 20 # Pause pour laisser le temps à VT d'analyser
          else
            echo "Fichier déjà connu de VirusTotal."
          fi

      - name: Upload .deb
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag_name }}
          files: "*.deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: build-windows
    runs-on: macos-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Download Binary
        run: |
          mkdir -p payload/usr/local/bin
          URL="https://github.com/tphakala/birdnet-go/releases/download/${{ needs.build-windows.outputs.upstream_tag }}/birdnet-go-darwin-arm64-${{ needs.build-windows.outputs.upstream_tag }}.tar.gz"
          curl -fsSL -o birdnet.tar.gz "$URL"
          tar -xzf birdnet.tar.gz -C payload/usr/local/bin
          find payload/usr/local/bin -name "birdnet-go" -type f -exec mv {} payload/usr/local/bin/ \;
          chmod +x payload/usr/local/bin/birdnet-go

      - name: Build .pkg
        run: |
          pkgbuild --root payload --identifier com.github.timeobonnin.birdnetgo --version ${{ needs.build-windows.outputs.upstream_tag }} --install-location / BirdNET-Go-macOS.pkg

      - name: Scan with VirusTotal (Mac)
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then exit 0; fi

          FILE_NAME="BirdNET-Go-macOS.pkg"
          HASH=$(shasum -a 256 "$FILE_NAME" | cut -d ' ' -f 1)
          LOOKUP="https://www.virustotal.com/api/v3/files/$HASH"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "x-apikey: $VT_API_KEY" "$LOOKUP")

          if [ "$HTTP_STATUS" -eq 404 ]; then
            echo "Fichier inconnu, upload en cours..."
            UPLOAD_URL=$(curl -s -H "x-apikey: $VT_API_KEY" "https://www.virustotal.com/api/v3/files/upload_url" | jq -r .data)
            curl -s -X POST "$UPLOAD_URL" -H "x-apikey: $VT_API_KEY" -F "file=@$FILE_NAME" > /dev/null
            sleep 20
          else
            echo "Fichier déjà connu de VirusTotal."
          fi

      - name: Upload .pkg
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag_name }}
          files: "*.pkg"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag_name }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
