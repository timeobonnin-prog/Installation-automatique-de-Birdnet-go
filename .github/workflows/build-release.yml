name: Build and Release All Platforms

on:
  push:
    branches: [main]
    paths:
      - "BirdNET-Go-Installer.iss"
      - "nfpm.yaml"
      - "BirdNET-Go-Tray.ps1"
      - ".github/workflows/build-release.yml"
  create:
    tags:
      - "v-*"
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1 : WINDOWS (.exe)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      upstream_tag: ${{ steps.upstream.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup and FFmpeg
        run: |
          choco install innosetup --no-progress -y
          choco install ffmpeg --no-progress -y

      - name: Fetch BirdNET-Go
        id: upstream
        shell: pwsh
        run: |
          $apiUrl = "https://api.github.com/repos/tphakala/birdnet-go/releases/latest"
          $headers = @{ "User-Agent" = "PowerShell" }
          $release = Invoke-RestMethod -Uri $apiUrl -Headers $headers
          echo "tag=$($release.tag_name)" >> $env:GITHUB_OUTPUT

          $asset = $release.assets | Where-Object { $_.name -match "windows.*amd64.*\.tar\.gz" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "birdnet.tar.gz"

          mkdir dist -Force | Out-Null
          tar -xzf birdnet.tar.gz -C dist

          $exe = Get-ChildItem -Path dist -Filter "birdnet-go.exe" -Recurse | Select-Object -First 1
          Move-Item -Path $exe.FullName -Destination "dist\birdnet-go.exe" -Force

          Set-Content -Path "dist\VERSION.txt" -Value $release.tag_name -Encoding UTF8
          Remove-Item birdnet.tar.gz

      - name: Copy FFmpeg and FFprobe to dist
        shell: pwsh
        run: |
          $ffmpegPath = (Get-Command ffmpeg).Source
          $ffprobePath = (Get-Command ffprobe).Source
          Copy-Item -Path $ffmpegPath -Destination "dist\ffmpeg.exe" -Force
          Copy-Item -Path $ffprobePath -Destination "dist\ffprobe.exe" -Force

      - name: Compile GUI to EXE
        shell: pwsh
        run: |
          Write-Host "Installation de ps2exe..."
          Install-Module ps2exe -Scope CurrentUser -Force

          Write-Host "Compilation de BirdNET-Go-Tray.ps1 vers dist\BirdNET-Go-Control.exe..."
          Invoke-ps2exe -InputFile "BirdNET-Go-Tray.ps1" -OutputFile "dist\BirdNET-Go-Control.exe" -noConsole -iconFile "icon.ico"

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "BirdNET-Go-Installer.iss"

      - name: Calculate Unique Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            echo "tag_name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag_name=v${{ steps.upstream.outputs.tag }}.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Output/BirdNET-Go-Windows.exe

  # ==========================================
  # JOB 2 : LINUX & RASPBERRY PI (.deb)
  # ==========================================
  build-linux:
    needs: build-windows
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Download Binary
        run: |
          mkdir -p dist
          URL="https://github.com/tphakala/birdnet-go/releases/download/${{ needs.build-windows.outputs.upstream_tag }}/birdnet-go-linux-${{ matrix.arch }}-${{ needs.build-windows.outputs.upstream_tag }}.tar.gz"
          curl -fsSL -o birdnet.tar.gz "$URL"
          tar -xzf birdnet.tar.gz -C dist
          find dist -name "birdnet-go" -type f -exec mv {} dist/ \;
          chmod +x dist/birdnet-go
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Build .deb
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.build-windows.outputs.upstream_tag }}
        run: |
          sed -i "s/\${ARCH}/${ARCH}/g" nfpm.yaml
          sed -i "s/\${VERSION}/${VERSION}/g" nfpm.yaml
          ~/go/bin/nfpm package -p deb -f nfpm.yaml
      - name: Rename .deb
        run: |
          if [ "${{ matrix.arch }}" = "amd64" ]; then mv *.deb BirdNET-Go-Linux-x64.deb; else mv *.deb BirdNET-Go-RaspberryPi.deb; fi

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-deb
          path: "*.deb"

  # ==========================================
  # JOB 3 : MACOS (.pkg)
  # ==========================================
  build-macos:
    needs: build-windows
    runs-on: macos-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Download Binary
        run: |
          mkdir -p payload/usr/local/bin
          URL="https://github.com/tphakala/birdnet-go/releases/download/${{ needs.build-windows.outputs.upstream_tag }}/birdnet-go-darwin-arm64-${{ needs.build-windows.outputs.upstream_tag }}.tar.gz"
          curl -fsSL -o birdnet.tar.gz "$URL"
          tar -xzf birdnet.tar.gz -C payload/usr/local/bin
          find payload/usr/local/bin -name "birdnet-go" -type f -exec mv {} payload/usr/local/bin/ \;
          chmod +x payload/usr/local/bin/birdnet-go
      - name: Build .pkg
        run: |
          pkgbuild --root payload --identifier com.github.timeobonnin.birdnetgo --version ${{ needs.build-windows.outputs.upstream_tag }} --install-location / BirdNET-Go-macOS.pkg

      - name: Upload Mac Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: "*.pkg"

  # ==========================================
  # JOB 4 : PUBLIER LA RELEASE
  # ==========================================
  publish-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-files
          merge-multiple: true

      - name: Scan all files with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then echo "Pas de clé API, on saute le scan."; exit 0; fi
          FILES=("all-files/BirdNET-Go-Windows.exe" "all-files/BirdNET-Go-Linux-x64.deb" "all-files/BirdNET-Go-RaspberryPi.deb" "all-files/BirdNET-Go-macOS.pkg")

          for FILE in "${FILES[@]}"; do
            if [ ! -f "$FILE" ]; then continue; fi
            FILE_NAME=$(basename "$FILE")
            HASH=$(sha256sum "$FILE" | cut -d ' ' -f 1)
            LOOKUP="https://www.virustotal.com/api/v3/files/$HASH"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "x-apikey: $VT_API_KEY" "$LOOKUP")
            
            if [ "$HTTP_STATUS" -eq 404 ]; then
              UPLOAD_URL=$(curl -s -H "x-apikey: $VT_API_KEY" "https://www.virustotal.com/api/v3/files/upload_url" | jq -r .data)
              curl -s -X POST "$UPLOAD_URL" -H "x-apikey: $VT_API_KEY" -F "file=@$FILE" > /dev/null
              sleep 30
            fi
            sleep 15
          done

      - name: Compute all SHA-256 hashes
        id: hashes
        run: |
          WIN_HASH=$(sha256sum all-files/BirdNET-Go-Windows.exe | cut -d ' ' -f 1)
          LINUX_HASH=$(sha256sum all-files/BirdNET-Go-Linux-x64.deb | cut -d ' ' -f 1)
          PI_HASH=$(sha256sum all-files/BirdNET-Go-RaspberryPi.deb | cut -d ' ' -f 1)
          MAC_HASH=$(sha256sum all-files/BirdNET-Go-macOS.pkg | cut -d ' ' -f 1)

          echo "WIN_HASH=$WIN_HASH" >> $GITHUB_ENV
          echo "LINUX_HASH=$LINUX_HASH" >> $GITHUB_ENV
          echo "PI_HASH=$PI_HASH" >> $GITHUB_ENV
          echo "MAC_HASH=$MAC_HASH" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-windows.outputs.tag_name }}
          name: "Version ${{ needs.build-windows.outputs.tag_name }}"
          draft: false
          generate_release_notes: false
          body: |
            <p align="center">
              <img src="https://raw.githubusercontent.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/main/logo.png" width="150" alt="Logo">
            </p>

            ### 🪶 BirdNET-Go Multi-Plateformes

            | Plateforme | Téléchargement | Analyse VirusTotal |
            | :--- | :--- | :--- |
            | 🪟 **Windows** | [Télécharger (.exe)](https://github.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/releases/latest/download/BirdNET-Go-Windows.exe) | [🔍 Rapport](https://www.virustotal.com/gui/file/${{ env.WIN_HASH }}) |
            | 🐧 **Linux (PC)** | [Télécharger (.deb)](https://github.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/releases/latest/download/BirdNET-Go-Linux-x64.deb) | [🔍 Rapport](https://www.virustotal.com/gui/file/${{ env.LINUX_HASH }}) |
            | 🍓 **Raspberry Pi** | [Télécharger (.deb)](https://github.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/releases/latest/download/BirdNET-Go-RaspberryPi.deb) | [🔍 Rapport](https://www.virustotal.com/gui/file/${{ env.PI_HASH }}) |
            | 🍎 **macOS** | [Télécharger (.pkg)](https://github.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/releases/latest/download/BirdNET-Go-macOS.pkg) | [🔍 Rapport](https://www.virustotal.com/gui/file/${{ env.MAC_HASH }}) |

            ---

            ### #️⃣ Empreintes SHA-256

            - **Windows :** `${{ env.WIN_HASH }}`
            - **Linux :** `${{ env.LINUX_HASH }}`
            - **Raspberry Pi :** `${{ env.PI_HASH }}`
            - **macOS :** `${{ env.MAC_HASH }}`
          files: all-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
