      - name: Fetch BirdNET-Go and FFmpeg
        id: upstream
        shell: pwsh
        run: |
          # 1. Téléchargement de BirdNET-Go
          $apiUrl = "https://api.github.com/repos/tphakala/birdnet-go/releases/latest"
          $headers = @{ "User-Agent" = "PowerShell" }
          $release = Invoke-RestMethod -Uri $apiUrl -Headers $headers
          echo "tag=$($release.tag_name)" >> $env:GITHUB_OUTPUT
          echo "url=$($release.html_url)" >> $env:GITHUB_OUTPUT
          
          $asset = $release.assets | Where-Object { $_.name -match "windows.*amd64.*\.tar\.gz" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "birdnet.tar.gz"
          
          mkdir dist -Force | Out-Null
          tar -xzf birdnet.tar.gz -C dist
          
          $exe = Get-ChildItem -Path dist -Filter "birdnet-go.exe" -Recurse | Select-Object -First 1
          Move-Item -Path $exe.FullName -Destination "dist\birdnet-go.exe" -Force
          
          Set-Content -Path "dist\VERSION.txt" -Value $release.tag_name -Encoding UTF8
          Remove-Item birdnet.tar.gz

          # 2. Téléchargement de FFmpeg ET FFprobe
          Write-Host "Téléchargement de FFmpeg et FFprobe..."
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp"
          
          # On cherche ffmpeg.exe et ffprobe.exe
          $ffmpegExe = Get-ChildItem -Path "ffmpeg-temp" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path "ffmpeg-temp" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          
          Copy-Item -Path $ffmpegExe.FullName -Destination "dist\ffmpeg.exe"
          Copy-Item -Path $ffprobeExe.FullName -Destination "dist\ffprobe.exe"
          
          # Nettoyage
          Remove-Item -Recurse -Force "ffmpeg-temp", "ffmpeg.zip"
