      - name: Scan with VirusTotal
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:VT_API_KEY) {
            Write-Error "Secret VT_API_KEY manquant."
            exit 1
          }

          $file = Get-Item 'Output\BirdNET-Go-Installer.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower()
          $headers = @{ 'x-apikey' = $env:VT_API_KEY }
          $lookup = "https://www.virustotal.com/api/v3/files/$hash"

          # 1. Vérifier si le fichier est déjà connu
          $alreadyKnown = $false
          try {
            $response = Invoke-WebRequest -Uri $lookup -Headers $headers -Method Get -UseBasicParsing
            if ($response.StatusCode -eq 200) {
              $alreadyKnown = $true
              Write-Host "Fichier déjà connu de VirusTotal."
            }
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -eq 404) {
              Write-Host "Fichier inconnu, upload en cours..."
            } elseif ($_.Exception.Response.StatusCode.value__ -eq 429) {
              Write-Error "Quota VirusTotal dépassé (429). Réessayez dans une minute."
              exit 1
            } else {
              Write-Error "Erreur inattendue lors de la recherche du hash : $_"
              exit 1
            }
          }

          # 2. Uploader si nécessaire (envoi du fichier en binaire, pas en base64)
          if (-not $alreadyKnown) {
            try {
              # Utilisation de la cmdlet moderne qui gère correctement le multipart
              $upload = Invoke-RestMethod -Method Post `
                -Uri 'https://www.virustotal.com/api/v3/files' `
                -Headers $headers `
                -Form @{ file = $file } # Passer l'objet FileInfo directement
              $analysisId = $upload.data.id
              Write-Host "Upload réussi, ID d'analyse : $analysisId"
            } catch {
              Write-Error "Échec de l'upload : $_"
              exit 1
            }

            # 3. Attendre la fin de l'analyse
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 10
              try {
                $analysis = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/analyses/$analysisId" -Headers $headers
                if ($analysis.data.attributes.status -eq 'completed') {
                  Write-Host "Analyse terminée."
                  break
                }
                Write-Host "Analyse en cours... ($($i+1)/30)"
              } catch {
                Write-Warning "Erreur lors du polling : $_"
              }
            }
          }

          # 4. Récupérer et évaluer le rapport final
          Start-Sleep -Seconds 5 # Petite pause pour laisser le temps à VT de finaliser
          try {
            $finalReport = Invoke-RestMethod -Uri $lookup -Headers $headers
            $stats = $finalReport.data.attributes.last_analysis_stats
          } catch {
            Write-Error "Impossible de récupérer le rapport final : $_"
            exit 1
          }

          Write-Host "Détections : malicious=$($stats.malicious) suspicious=$($stats.suspicious)"
          if ($stats.malicious -gt 2) {
            Write-Error "Trop de détections ($($stats.malicious)). Publication annulée."
            exit 1
          }
