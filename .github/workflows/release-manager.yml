name: Release Manager (Build & Scan)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Forcer la compilation même si pas de nouvelle version"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.upstream.outputs.tag }}
      should_build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Get latest upstream version
        id: upstream
        run: |
          TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/tphakala/birdnet-go/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check if build is needed
        id: check
        run: |
          CURRENT=$(cat VERSION.txt 2>/dev/null || echo "none")
          UPSTREAM="${{ steps.upstream.outputs.tag }}"
          if [ "$CURRENT" != "$UPSTREAM" ] || [ "${{ github.event.inputs.force_build }}" == "true" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "Nouvelle version detectee ($UPSTREAM) ou build force."
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "Aucune nouvelle version. Arret."
          fi

  build-windows:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: windows-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup and FFmpeg
        run: |
          choco install innosetup --no-progress -y
          choco install ffmpeg --no-progress -y

      - name: Fetch BirdNET-Go
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/tphakala/birdnet-go/releases/latest" -Headers @{ "User-Agent" = "PowerShell"; "Authorization" = "Bearer $env:GITHUB_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -match "windows.*amd64.*\.tar\.gz" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "birdnet.tar.gz"
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          tar -xzf "birdnet.tar.gz" -C "dist"
          $required = @("birdnet-go.exe", "onnxruntime.dll", "tensorflowlite_c.dll")
          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path "dist\$f")) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Fichiers manquants dans dist : $($missing -join ', ')"
            Get-ChildItem -Path "dist" -Recurse | Format-Table -AutoSize
            exit 1
          }
          Set-Content -Path "dist\VERSION.txt" -Value $release.tag_name -Encoding UTF8
          Remove-Item "birdnet.tar.gz" -Force

      - name: Copy FFmpeg
        shell: pwsh
        run: |
          Copy-Item -Path (Get-Command ffmpeg).Source -Destination "dist\ffmpeg.exe" -Force
          Copy-Item -Path (Get-Command ffprobe).Source -Destination "dist\ffprobe.exe" -Force

      - name: Compile GUI to EXE
        shell: pwsh
        run: |
          Install-Module ps2exe -Scope CurrentUser -Force
          Invoke-ps2exe -InputFile "BirdNET-Go-Tray.ps1" -OutputFile "dist\BirdNET-Go-Control.exe" -noConsole -iconFile "icon.ico"

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "BirdNET-Go-Installer.iss"

      - name: Calculate Padded Version
        id: version
        shell: pwsh
        run: |
          $runNumber = "{0:D3}" -f ${{ github.run_number }}
          $upstreamTag = "${{ needs.check-update.outputs.upstream_tag }}"
          echo "tag_name=v$upstreamTag.$runNumber" >> $env:GITHUB_OUTPUT

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Output/BirdNET-Go-Windows.exe

  build-linux-mac:
    needs: [check-update, build-windows]
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux-amd64, linux-arm64, darwin-arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Download Binary
        run: |
          mkdir -p dist
          URL="https://github.com/tphakala/birdnet-go/releases/download/${{ needs.check-update.outputs.upstream_tag }}/birdnet-go-${{ matrix.platform }}-${{ needs.check-update.outputs.upstream_tag }}.tar.gz"
          curl -fsSL -o birdnet.tar.gz "$URL"
          tar -xzf birdnet.tar.gz -C dist

      - name: Install nfpm (Linux only)
        if: contains(matrix.platform, 'linux')
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build .deb (Linux)
        if: contains(matrix.platform, 'linux')
        env:
          ARCH: ${{ contains(matrix.platform, 'amd64') && 'amd64' || 'arm64' }}
          VERSION: ${{ needs.check-update.outputs.upstream_tag }}
        run: |
          sed -i "s/\${ARCH}/${ARCH}/g" nfpm.yaml
          sed -i "s/\${VERSION}/${VERSION}/g" nfpm.yaml
          ~/go/bin/nfpm package -p deb -f nfpm.yaml
          if [ "$ARCH" = "amd64" ]; then mv *.deb BirdNET-Go-Linux-x64.deb; else mv *.deb BirdNET-Go-RaspberryPi.deb; fi

      - name: Build .pkg (Mac)
        if: contains(matrix.platform, 'darwin')
        run: |
          mkdir -p payload/usr/local/bin
          cp -r dist/* payload/usr/local/bin/
          chmod +x payload/usr/local/bin/birdnet-go
          pkgbuild --root payload --identifier com.github.timeobonnin.birdnetgo --version ${{ needs.check-update.outputs.upstream_tag }} --install-location / BirdNET-Go-macOS.pkg

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-pkg
          path: |
            *.deb
            *.pkg

  publish-release:
    needs: [check-update, build-windows, build-linux-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-files
          merge-multiple: true

      - name: Scan with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then echo "Pas de cle API."; exit 0; fi
          FILES=("all-files/BirdNET-Go-Windows.exe" "all-files/BirdNET-Go-Linux-x64.deb" "all-files/BirdNET-Go-RaspberryPi.deb" "all-files/BirdNET-Go-macOS.pkg")
          for FILE in "${FILES[@]}"; do
            if [ ! -f "$FILE" ]; then continue; fi
            HASH=$(sha256sum "$FILE" | cut -d ' ' -f 1)
            LOOKUP="https://www.virustotal.com/api/v3/files/$HASH"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "x-apikey: $VT_API_KEY" "$LOOKUP")
            if [ "$HTTP_STATUS" -eq 404 ]; then
              UPLOAD_URL=$(curl -s -H "x-apikey: $VT_API_KEY" "https://www.virustotal.com/api/v3/files/upload_url" | jq -r .data)
              curl -s -X POST "$UPLOAD_URL" -H "x-apikey: $VT_API_KEY" -F "file=@$FILE" > /dev/null
              sleep 30
            fi
            sleep 15
          done

      - name: Compute Hashes
        run: |
          echo "WIN_HASH=$(sha256sum all-files/BirdNET-Go-Windows.exe | cut -d ' ' -f 1)" >> $GITHUB_ENV
          echo "LINUX_HASH=$(sha256sum all-files/BirdNET-Go-Linux-x64.deb | cut -d ' ' -f 1)" >> $GITHUB_ENV
          echo "PI_HASH=$(sha256sum all-files/BirdNET-Go-RaspberryPi.deb | cut -d ' ' -f 1)" >> $GITHUB_ENV
          echo "MAC_HASH=$(sha256sum all-files/BirdNET-Go-macOS.pkg | cut -d ' ' -f 1)" >> $GITHUB_ENV

      - name: Update VERSION.txt
        run: echo "${{ needs.check-update.outputs.upstream_tag }}" > VERSION.txt

      - name: Commit Version Bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION.txt
          git commit -m "chore: bump to ${{ needs.check-update.outputs.upstream_tag }} [skip ci]" || true
          git push

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag_name }}
          name: "Version ${{ needs.build-windows.outputs.tag_name }}"
          files: all-files/*
          body: |
            ### BirdNET-Go (Multi-Plateformes)

            | Plateforme | Telechargement | VirusTotal |
            | :--- | :--- | :--- |
            | Windows | [Telecharger (.exe)](https://github.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/releases/latest/download/BirdNET-Go-Windows.exe) | [Rapport](https://www.virustotal.com/gui/file/${{ env.WIN_HASH }}) |
            | Linux | [Telecharger (.deb)](https://github.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/releases/latest/download/BirdNET-Go-Linux-x64.deb) | [Rapport](https://www.virustotal.com/gui/file/${{ env.LINUX_HASH }}) |
            | Raspberry Pi | [Telecharger (.deb)](https://github.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/releases/latest/download/BirdNET-Go-RaspberryPi.deb) | [Rapport](https://www.virustotal.com/gui/file/${{ env.PI_HASH }}) |
            | macOS | [Telecharger (.pkg)](https://github.com/timeobonnin-prog/Installation-automatique-de-Birdnet-go/releases/latest/download/BirdNET-Go-macOS.pkg) | [Rapport](https://www.virustotal.com/gui/file/${{ env.MAC_HASH }}) |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
