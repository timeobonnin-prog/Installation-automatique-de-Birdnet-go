name: Super-Linter (Vérification de syntaxe)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@v6
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Activer uniquement les langages qui nous intéressent
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_BASH: true
          VALIDATE_POWERSHELL: true
          # Ignorer les dossiers inutiles
          FILTER_REGEX_EXCLUDE: ".*dist/.*|.*Output/.*"
          # Ne pas bloquer le workflow si c'est juste un problème de style
          DISABLE_ERRORS: false
