name: Super-Linter (Vérification de syntaxe)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@v6
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # On active uniquement les langages qu'on veut tester
          VALIDATE_YAML: true
          VALIDATE_BASH: true
          VALIDATE_POWERSHELL: true

          # On exclut les dossiers inutiles ET les fichiers Markdown (.md)
          FILTER_REGEX_EXCLUDE: ".*dist/.*|.*Output/.*|.*node_modules/.*|.*\\.md"

          # Si erreur de style, ne pas bloquer le pipeline
          DISABLE_ERRORS: true
