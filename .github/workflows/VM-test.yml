name: Tests d'Installation Réels Multi-VM (Linux, ARM, Raspberry Pi, macOS, Windows)

on:
  push:
    branches: [ main, master, principal ]
  pull_request:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------------
  # 1. VM LINUX (x86_64 et ARM64) & VM MACOS
  # -------------------------------------------------------------------------
  test-install-linux-arm-macos:
    name: Installation sur ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux Ubuntu (x86_64)"
            os: ubuntu-latest
          - name: "Linux ARM64 (Serveur ARM)"
            os: ubuntu-24.04-arm
          - name: "macOS (Apple Silicon)"
            os: macos-latest
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Afficher les infos de la machine virtuelle
        run: |
          echo "Système : $(uname -s) | Architecture : $(uname -m)"

      - name: Tenter l'installation réelle et enregistrer le résultat
        continue-on-error: true
        run: |
          chmod +x *.sh scripts/*.sh 2>/dev/null || true
          export CI=true
          export DEBIAN_FRONTEND=noninteractive
          
          echo "=== Démarrage du test d'installation sur ${{ matrix.name }} ==="
          if [ -f "./installer-birdnet.sh" ]; then
            if ./installer-birdnet.sh; then
              echo "✅ SUCCÈS : L'installation s'est terminée sans erreur sur ${{ matrix.name }} !" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ ÉCHEC / AVERTISSEMENT : L'installateur a rencontré un problème sur ${{ matrix.name }} (voir les logs)." >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          else
            echo "❌ ERREUR : Fichier installer-birdnet.sh introuvable." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # -------------------------------------------------------------------------
  # 2. VM ÉMULÉE RASPBERRY PI OS (ARM64)
  # -------------------------------------------------------------------------
  test-install-raspberry-pi:
    name: Installation sur Raspberry Pi OS (Émulation QEMU)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Démarrer Raspberry Pi OS et tenter l'installation
        uses: pguyot/arm-runner-action@v2.6.5
        continue-on-error: true
        with:
          base_image: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2024-11-19/2024-11-19-raspios-bookworm-arm64-lite.img.xz
          cpu: cortex-a72
          commands: |
            echo "=== Système Raspberry Pi OS ==="
            uname -a
            chmod +x *.sh scripts/*.sh 2>/dev/null || true
            export CI=true
            export DEBIAN_FRONTEND=noninteractive
            
            if [ -f "./installer-birdnet.sh" ]; then
              ./installer-birdnet.sh
            else
              echo "installer-birdnet.sh introuvable !"
              exit 1
            fi

      - name: Écrire le résultat Raspberry Pi dans le rapport
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ SUCCÈS : Installation réussie sur Raspberry Pi OS !" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ AVERTISSEMENT : L'installation sur Raspberry Pi OS a rencontré une erreur (voir les logs)." >> $GITHUB_STEP_SUMMARY
          fi

  # -------------------------------------------------------------------------
  # 3. VM WINDOWS (COMPILATION & TEST INSTALLATEUR)
  # -------------------------------------------------------------------------
  test-install-windows:
    name: Compilation & Test sur Windows
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Compiler l'installateur Windows (BirdNET-Go-Installer.iss)
        id: build_win
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        continue-on-error: true
        with:
          path: BirdNET-Go-Installer.iss
          options: /O+

      - name: Écrire le résultat Windows dans le rapport
        if: always()
        run: |
          if ("${{ steps.build_win.outcome }}" -eq "success") {
            echo "✅ SUCCÈS : L'installateur Windows a été compilé sans erreur !" >> $env:GITHUB_STEP_SUMMARY
          } else {
            echo "⚠️ AVERTISSEMENT : Erreur lors de la compilation Windows (voir les logs)." >> $env:GITHUB_STEP_SUMMARY
          }
