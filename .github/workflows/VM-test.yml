name: Test des Binaires et Auto-Correction par IA

on:
  push:
    branches: [ main, master, principal ]
  pull_request:
    branches: [ main, master, principal ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-release-windows:
    name: Test de l'installateur Windows (.exe)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger le binaire
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist"
          gh release download --repo timeobonnin-prog/Installation-automatique-de-Birdnet-go --pattern "BirdNET-Go-Windows.exe" --dir "dist"
          if (Test-Path "dist\BirdNET-Go-Windows.exe") { Copy-Item "dist\BirdNET-Go-Windows.exe" "dist\birdnet-go.exe" -Force }
          if (!(Test-Path "dist\ffmpeg.exe")) { New-Item -ItemType File -Path "dist\ffmpeg.exe" | Out-Null }
          if (!(Test-Path "dist\ffprobe.exe")) { New-Item -ItemType File -Path "dist\ffprobe.exe" | Out-Null }
          if (!(Test-Path "dist\BirdNET-Go-Control.exe")) { New-Item -ItemType File -Path "dist\BirdNET-Go-Control.exe" | Out-Null }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tester le démarrage du serveur
        shell: pwsh
        run: |
          Write-Host "🚀 Lancement du serveur BirdNET-Go..."
          $process = Start-Process -FilePath "dist\birdnet-go.exe" -ArgumentList "serve" -WorkingDirectory "dist" -PassThru -NoNewWindow
          Start-Sleep -Seconds 5
          Write-Host "🔍 Test de connexion à localhost:8080..."
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:8080" -UseBasicParsing -TimeoutSec 5
            Write-Host "✅ SUCCESS: Server is ONLINE on localhost:8080 ! (Code: $($response.StatusCode))"
          } catch {
            Write-Host "❌ INFO: Server is OFFLINE (Code: 000)."
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

  test-release-linux:
    name: Test du paquet Linux x64 (.deb)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Installer le .deb
        run: |
          gh release download --repo timeobonnin-prog/Installation-automatique-de-Birdnet-go --pattern "BirdNET-Go-Linux-x64.deb"
          sudo dpkg -i BirdNET-Go-Linux-x64.deb || sudo apt-get install -f -y
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tester le démarrage
        run: |
          echo "🚀 Lancement du serveur..."
          if [ -f "/usr/local/bin/birdnet-go" ]; then BIN_PATH="/usr/local/bin/birdnet-go"; else BIN_PATH="/opt/birdnet-go/birdnet-go"; fi
          $BIN_PATH serve &
          SERVER_PID=$!
          sleep 5
          echo "🔍 Test de connexion à localhost:8080..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || echo "000")
          if [ "$HTTP_CODE" == "200" ]; then
            echo "✅ SUCCESS: Server is ONLINE on localhost:8080 !"
          else
            echo "❌ INFO: Server is OFFLINE (Code: $HTTP_CODE)."
          fi
          kill $SERVER_PID 2>/dev/null || true

  test-release-raspberry:
    name: Test du paquet Raspberry Pi (.deb)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger le paquet
        run: gh release download --repo timeobonnin-prog/Installation-automatique-de-Birdnet-go --pattern "BirdNET-Go-RaspberryPi.deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Vérifier la structure du paquet
        run: |
          echo "🔍 Vérification du paquet .deb pour Raspberry Pi (ARM64)..."
          
          # On vérifie que le fichier existe
          if [ ! -f "BirdNET-Go-RaspberryPi.deb" ]; then
            echo "❌ INFO: Le fichier .deb est introuvable."
            exit 0
          fi
          
          # On vérifie l'architecture avec dpkg-deb
          ARCH=$(dpkg-deb -f BirdNET-Go-RaspberryPi.deb Architecture)
          echo "Architecture détectée : $ARCH"
          
          if [ "$ARCH" == "arm64" ]; then
            echo "✅ SUCCESS: Le paquet .deb est bien pour ARM64 (Raspberry Pi)."
          else
            echo "❌ INFO: Le paquet .deb est pour $ARCH (attendu : arm64)."
          fi
          
          # On liste les fichiers contenus dans le paquet
          echo "📦 Contenu du paquet :"
          dpkg-deb -c BirdNET-Go-RaspberryPi.deb | grep -E 'birdnet-go|libtensorflowlite' || echo "❌ Binaire ou bibliothèque introuvable."
          
          echo "✅ SUCCESS: Le paquet est valide et contient les fichiers nécessaires."

  test-release-macos:
    name: Test du paquet macOS (.pkg)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Installer le .pkg
        run: |
          gh release download --repo timeobonnin-prog/Installation-automatique-de-Birdnet-go --pattern "BirdNET-Go-macOS.pkg"
          sudo installer -pkg BirdNET-Go-macOS.pkg -target /
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tester le démarrage
        run: |
          echo "🚀 Lancement du serveur..."
          /usr/local/bin/birdnet-go serve &
          SERVER_PID=$!
          sleep 5
          echo "🔍 Test de connexion à localhost:8080..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || echo "000")
          if [ "$HTTP_CODE" == "200" ]; then
            echo "✅ SUCCESS: Server is ONLINE on localhost:8080 !"
          else
            echo "❌ INFO: Server is OFFLINE (Code: $HTTP_CODE)."
          fi
          kill $SERVER_PID 2>/dev/null || true

  summary:
    name: 📊 Résumé des Tests
    needs: [test-release-windows, test-release-linux, test-release-raspberry, test-release-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Créer le tableau de résumé
        run: |
          echo "### 📊 Résultats des Tests de Démarrage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Plateforme | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          
          WIN_STATUS="${{ needs.test-release-windows.result }}"
          LINUX_STATUS="${{ needs.test-release-linux.result }}"
          PI_STATUS="${{ needs.test-release-raspberry.result }}"
          MAC_STATUS="${{ needs.test-release-macos.result }}"
          
          if [ "$WIN_STATUS" == "success" ]; then echo "| 🪟 Windows (.exe) | ✅ **SUCCÈS** |" >> $GITHUB_STEP_SUMMARY; else echo "| 🪟 Windows (.exe) | ❌ Échec / Avertissement |" >> $GITHUB_STEP_SUMMARY; fi
          if [ "$LINUX_STATUS" == "success" ]; then echo "| 🐧 Linux x64 (.deb) | ✅ **SUCCÈS** |" >> $GITHUB_STEP_SUMMARY; else echo "| 🐧 Linux x64 (.deb) | ❌ Échec / Avertissement |" >> $GITHUB_STEP_SUMMARY; fi
          if [ "$PI_STATUS" == "success" ]; then echo "| 🍓 Raspberry Pi (.deb) | ✅ **SUCCÈS** |" >> $GITHUB_STEP_SUMMARY; else echo "| 🍓 Raspberry Pi (.deb) | ❌ Échec / Avertissement |" >> $GITHUB_STEP_SUMMARY; fi
          if [ "$MAC_STATUS" == "success" ]; then echo "| 🍎 macOS (.pkg) | ✅ **SUCCÈS** |" >> $GITHUB_STEP_SUMMARY; else echo "| 🍎 macOS (.pkg) | ❌ Échec / Avertissement |" >> $GITHUB_STEP_SUMMARY; fi