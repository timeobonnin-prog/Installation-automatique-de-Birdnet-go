name: Update HTML Page

on:
  schedule:
    - cron: "0 8 * * *" # Tous les jours à 8h
  workflow_dispatch:
  push:
    paths:
      - "index.html.template"
      - "generate_html.py"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate > releases.json
          echo "Releases récupérées :"
          python3 -c "import json; [print(' -', r['tag_name'], '(prerelease)' if r['prerelease'] else '(stable)') for r in json.load(open('releases.json'))]"

      - name: Générer index.html
        run: python3 generate_html.py

      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: update index.html [skip ci]"
          git push || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
