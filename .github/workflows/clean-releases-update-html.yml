name: Clean Releases + Update HTML

on:
  schedule:
    - cron: "55 15 * * *" # Tous les jours à 15h55 UTC
  workflow_dispatch: # Déclenchement manuel possible
  release:
    types: [published, edited, deleted]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # 1. NETTOYAGE DES RELEASES OBSOLÈTES
  # ------------------------------------------------------------------
  cleanup-releases:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Nettoyage des miroirs et tri par version officielle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCAL: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import os, re, json, subprocess

          repo = os.environ["LOCAL"]
          cmd = ["gh", "api", f"repos/{repo}/releases?per_page=100", "--paginate"]
          releases = json.loads(subprocess.check_output(cmd).decode())

          # Pattern pour identifier les tags valides (ex: v20261031.102-1 ou nightly-v20261031)
          pattern = re.compile(r'^(nightly-v|v)(\d+)\.(\d+)(?:-(\d+))?$')
          grouped = {}
          to_delete = []

          for r in releases:
              tag = r["tag_name"]
              if tag.startswith("manual-"):
                  print(f"[CONSERVE - Manuel] {tag}")
                  continue

              match = pattern.match(tag)
              if not match:
                  print(f"[A SUPPRIMER - Miroir / Inconnu] {tag}")
                  to_delete.append(tag)
              else:
                  prefix, base_ver, build_str, patch_str = match.groups()
                  build_num = int(build_str)
                  patch_num = int(patch_str) if patch_str else 0

                  key = f"{prefix}{base_ver}"
                  grouped.setdefault(key, []).append(((build_num, patch_num), tag))

          for key, items in grouped.items():
              items.sort(key=lambda x: x[0], reverse=True)
              print(f"[CONSERVE - Plus récent de {key}] {items[0][1]}")
              for _, old_tag in items[1:]:
                  print(f"[A SUPPRIMER - Ancien de {key}] {old_tag}")
                  to_delete.append(old_tag)

          for tag in to_delete:
              print(f"Suppression de {tag}...")
              del_cmd = ["gh", "release", "delete", tag, "--repo", repo, "--yes", "--cleanup-tag"]
              subprocess.run(del_cmd, check=False)
          EOF

  # ------------------------------------------------------------------
  # 2. GÉNÉRATION ET DÉPLOIEMENT DE LA PAGE HTML + UPDATE.JSON
  # ------------------------------------------------------------------
  update-html:
    needs: cleanup-releases
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch releases & Générer HTML
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate > releases.json

          # Exécute le script Python qui génère index.html et update.json
          python3 generate_html.py

          # Vérification de sécurité : le fichier HTML doit exister et contenir les balises de base
          if [ ! -s index.html ]; then
            echo "❌ Erreur : index.html est vide ou introuvable !"
            exit 1
          fi
          if ! grep -qi "<html" index.html || ! grep -qi "</html>" index.html; then
            echo "❌ Erreur : index.html semble corrompu !"
            exit 1
          fi
          echo "✅ Vérification HTML réussie !"

      - name: Commit index.html + update.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html update.json
          if git diff --staged --quiet; then
            echo "ℹ️ Aucun changement détecté dans index.html ou update.json."
          else
            git commit -m "chore: update index.html + update.json [skip ci]"
            git push || echo "⚠️ Échec du push (peut être normal si la branche est protégée ou en conflit)"
          fi

      - name: Créer le fichier .nojekyll
        run: touch .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
