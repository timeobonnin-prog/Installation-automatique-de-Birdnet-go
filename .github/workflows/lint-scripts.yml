name: Lint Scripts

on:
  push:
    branches: [ main ]
    paths:
      - 'install-birdnet.sh'
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck on main script
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './'
          ignore_paths: '.github'
          severity: error # On ne bloque que sur les vraies erreurs, pas les simples avertissements
