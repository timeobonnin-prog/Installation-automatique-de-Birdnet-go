name: Update BirdNET-Go Version

on:
  schedule:
    - cron: "0 6 * * *"   # Tous les jours à 6h UTC
  workflow_dispatch:        # Déclenchement manuel possible

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest BirdNET-Go release
        id: latest
        run: |
          TAG=$(curl -s https://api.github.com/repos/tphakala/birdnet-go/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Dernière version : $TAG"

      - name: Update VERSION.txt
        run: |
          echo "${{ steps.latest.outputs.tag }}" > VERSION.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION.txt
          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
          else
            git commit -m "chore: mise à jour BirdNET-Go vers ${{ steps.latest.outputs.tag }}"
            git push
          fi
