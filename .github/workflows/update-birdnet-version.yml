name: Update BirdNET-Go Version

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest BirdNET-Go release
        id: latest
        run: |
          TAG=$(curl -s https://api.github.com/repos/tphakala/birdnet-go/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Update VERSION.txt and trigger
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$TAG" > VERSION.txt
          git add VERSION.txt
          if git diff --cached --quiet; then
            echo "Aucune nouvelle version."
            exit 0
          fi
          git commit -m "chore: BirdNET-Go $TAG"
          git push
