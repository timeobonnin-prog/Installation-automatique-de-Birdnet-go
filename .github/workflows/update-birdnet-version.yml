name: Daily Check and Release

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest BirdNET-Go version
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/tphakala/birdnet-go/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check if release is needed
        id: check
        run: |
          CURRENT_VERSION=$(cat VERSION.txt)
          UPSTREAM_VERSION="${{ steps.upstream.outputs.tag }}"
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            NEW_COMMITS="true"
          else
            COMMIT_COUNT=$(git rev-list $LATEST_TAG..HEAD --count)
            if [ "$COMMIT_COUNT" -gt 0 ]; then
              NEW_COMMITS="true"
            else
              NEW_COMMITS="false"
            fi
          fi

          if [ "$CURRENT_VERSION" != "$UPSTREAM_VERSION" ] || [ "$NEW_COMMITS" == "true" ]; then
            echo "release_needed=true" >> $GITHUB_OUTPUT
          else
            echo "release_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update VERSION.txt if upstream changed
        run: |
          echo "${{ steps.upstream.outputs.tag }}" > VERSION.txt

      - name: Commit and Tag if needed
        if: steps.check.outputs.release_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add VERSION.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update BirdNET-Go version to ${{ steps.upstream.outputs.tag }} [skip ci]"
            git push
          fi

          NEW_TAG="v${{ steps.upstream.outputs.tag }}.${{ github.run_number }}"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
