name: Scan VirusTotal

on:
  # Une seule fois par jour, à 4h du matin (avant le build de 6h)
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-virustotal
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Scan unscanned releases with VirusTotal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "VT_API_KEY non configuree - scan ignore."
            exit 0
          fi

          mkdir -p /tmp/vt_assets
          RELEASES=$(gh release list --limit 100 --json tagName,isDraft \
            -q '.[] | select(.isDraft == false) | .tagName')
          if [ -z "$RELEASES" ]; then
            echo "Aucune release a scanner."
            exit 0
          fi

          SCANNED=0
          SKIPPED=0
          ERRORS=0

          for tag in $RELEASES; do
            echo "============================================================"
            echo "Release : $tag"
            echo "============================================================"

            BODY=$(gh release view "$tag" --json body -q '.body // ""')
            if echo "$BODY" | grep -qi "virustotal.com"; then
              echo "Deja scanne - skip."
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            rm -rf /tmp/vt_assets/*
            if ! gh release download "$tag" --dir /tmp/vt_assets --clobber 2>/dev/null; then
              echo "Pas d'assets - skip."
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            ASSETS=$(ls -1 /tmp/vt_assets 2>/dev/null)
            if [ -z "$ASSETS" ]; then
              echo "Aucun fichier - skip."
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            echo "| Fichier | Taille | Rapport VirusTotal |" > /tmp/vt_table.md
            echo "| :--- | :--- | :--- |" >> /tmp/vt_table.md

            for file in /tmp/vt_assets/*; do
              [ -f "$file" ] || continue
              FILENAME=$(basename "$file")
              FILESIZE=$(du -h "$file" | cut -f1)
              echo "  -> $FILENAME ($FILESIZE)"
              HASH=$(sha256sum "$file" | cut -d' ' -f1)
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "x-apikey: $VT_API_KEY" \
                "https://www.virustotal.com/api/v3/files/$HASH")

              if [ "$HTTP_STATUS" = "200" ]; then
                echo "    Deja analyse par VirusTotal."
              else
                echo "    Upload vers VirusTotal..."
                UPLOAD_URL=$(curl -s -H "x-apikey: $VT_API_KEY" \
                  "https://www.virustotal.com/api/v3/files/upload_url" | jq -r .data)
                if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
                  echo "    Impossible d'obtenir l'URL."
                  ERRORS=$((ERRORS + 1))
                  continue
                fi
                UPLOAD_RESPONSE=$(curl -s -X POST "$UPLOAD_URL" \
                  -H "x-apikey: $VT_API_KEY" \
                  -F "file=@$file")
                if echo "$UPLOAD_RESPONSE" | grep -q '"error"'; then
                  echo "    Erreur upload."
                  ERRORS=$((ERRORS + 1))
                  continue
                fi
                echo "    Upload OK - attente 30s..."
                sleep 30
              fi

              VT_URL="https://www.virustotal.com/gui/file/${HASH}"
              echo "| ${FILENAME} | ${FILESIZE} | [Voir le rapport](${VT_URL}) |" >> /tmp/vt_table.md
            done

            echo "$BODY" > /tmp/new_body.md
            echo "" >> /tmp/new_body.md
            echo "---" >> /tmp/new_body.md
            echo "" >> /tmp/new_body.md
            echo "### Analyse VirusTotal" >> /tmp/new_body.md
            echo "" >> /tmp/new_body.md
            cat /tmp/vt_table.md >> /tmp/new_body.md

            if gh release edit "$tag" --notes-file /tmp/new_body.md; then
              echo "  Body mis a jour pour $tag"
              SCANNED=$((SCANNED + 1))
            else
              echo "  Echec mise a jour body pour $tag"
              ERRORS=$((ERRORS + 1))
            fi
          done

          echo ""
          echo "============================================================"
          echo " RESUME DU SCAN"
          echo "============================================================"
          echo " Scannees  : $SCANNED"
          echo " Ignorees  : $SKIPPED"
          echo " Erreurs   : $ERRORS"
          echo "============================================================"

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
