name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*.*.*'          # Déclenché quand un tag de version est poussé (ex: v1.0.0)
  workflow_dispatch:       # Permet aussi un déclenchement manuel

permissions:
  contents: write          # Indispensable pour créer une Release

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "BirdNET-Go-Installer.iss"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/BirdNET-Go-Installer.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
