name: Build, Scan and Release Windows Installer

on:
  push:
    tags:
      - 'v-*'          # déclenché par update-birdnet-version.yml
      - 'v*.*.*'       # déclenchement manuel possible
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-scan-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "BirdNET-Go-Installer.iss"

      # --- Signature numérique (optionnelle, s'exécute si secrets présents) ---
      - name: Sign installer (optional)
        if: ${{ secrets.CODESIGN_PFX_B64 != '' }}
        shell: pwsh
        env:
          CODESIGN_PFX_B64: ${{ secrets.CODESIGN_PFX_B64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [System.IO.File]::WriteAllBytes(
            $pfxPath,
            [System.Convert]::FromBase64String($env:CODESIGN_PFX_B64)
          )
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe introuvable" }
          & $signtool.FullName sign `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /f $pfxPath /p $env:CODESIGN_PFX_PASSWORD `
            'Output\BirdNET-Go-Installer.exe'

      # --- Scan VirusTotal avec seuil bloquant ---
      - name: Scan with VirusTotal (threshold)
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if (-not $env:VT_API_KEY) {
            Write-Error "Secret VT_API_KEY manquant. Configure-le dans Settings > Secrets."
            exit 1
          }
          $file = 'Output\BirdNET-Go-Installer.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
          $headers = @{ 'x-apikey' = $env:VT_API_KEY }

          # Upload si le fichier n'est pas déjà connu
          $lookup = "https://www.virustotal.com/api/v3/files/$hash"
          try {
            Invoke-RestMethod -Uri $lookup -Headers $headers | Out-Null
          } catch {
            Write-Host "Fichier inconnu de VirusTotal, upload en cours..."
            $upload = Invoke-RestMethod -Method Post `
              -Uri 'https://www.virustotal.com/api/v3/files' `
              -Headers $headers `
              -Form @{ file = Get-Item $file }
            $analysisId = $upload.data.id
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 10
              $a = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/analyses/$analysisId" -Headers $headers
              if ($a.data.attributes.status -eq 'completed') { break }
            }
          }

          Start-Sleep -Seconds 10
          $resp = Invoke-RestMethod -Uri $lookup -Headers $headers
          $stats = $resp.data.attributes.last_analysis_stats
          Write-Host "Détections : malicious=$($stats.malicious) suspicious=$($stats.suspicious)"
          if ($stats.malicious -gt 2) {
            Write-Error "Trop de moteurs détectent le fichier comme malveillant ($($stats.malicious)). Publication annulée."
            exit 1
          }

      # --- Création de la Release avec le .exe attaché ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/BirdNET-Go-Installer.exe
          generate_release_notes: true
          body: |
            Installateur Windows auto-généré pour BirdNET-Go.
            Version cible : `${{ github.ref_name }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
