version: 2
updates:
  # Mettre à jour les actions GitHub automatiquement
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Mettre à jour les paquets .NET (NuGet) automatiquement
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
